GPS/routing stabil tidak diubah.</span></div><div id="gps" class="layer on"><iframe src="v72.html?v=783-gps" title="Peta GPS"></iframe></div><div id="hd" class="layer"><div id="loading" class="loader">Memuat A0 HD…</div><img id="hdImg" alt="Peta HD"></div><div id="zoom"><button onclick="zoomBy(1/1.35)">−</button><button onclick="fit()">⌂</button><button onclick="zoomBy(1.35)">+</button></div><div id="badge" class="badge">Peta GPS stabil</div><script>const gps=document.getElementById('gps'),hd=document.getElementById('hd'),img=document.getElementById('hdImg'),loading=document.getElementById('loading'),zoom=document.getElementById('zoom'),badge=document.getElementById('badge');let kind='',scale=1,fitScale=1,x=0,y=0,drag=false,sx=0,sy=0,ox=0,oy=0;const cache={};function active(id){['bGps','bA0','bLad'].forEach(k=>document.getElementById(k).classList.remove('on'));document.getElementById(id).classList.add('on')}async function getText(paths){const parts=await Promise.all(paths.map(p=>fetch(p+'?v=783',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(p+' HTTP '+r.status);return r.text()})));return parts.join('').replace(/\s+/g,'')}async function loadA0(){if(cache.a0)return cache.a0;const b64=await getText(['v783/a0_00','v783/a0_01','v783/a0_02','v783/a0_03']);return cache.a0='data:image/webp;base64,'+b64}async function loadLadangPreview(){if(cache.lad)return cache.lad;const t=await fetch('v78/ladang.b64?v=783',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Ladang HTTP '+r.status);return r.text()});return cache.lad='data:image/jpeg;base64,'+t.trim()}async function mode(m){gps.classList.remove('on');hd.classList.remove('on');zoom.style.display='none';if(m==='gps'){gps.classList.add('on');active('bGps');badge.textContent='Peta GPS stabil — routing & GPS kekal';return}kind=m;hd.classList.add('on');zoom.style.display='flex';loading.style.display='grid';loading.textContent=m==='a0'?'Memuat A0 HD…':'Memuat Ladang Preview…';active(m==='a0'?'bA0':'bLad');try{img.src=m==='a0'?a
