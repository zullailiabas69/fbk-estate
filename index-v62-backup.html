<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1812">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FBK Estate">
<title>FELDA Bukit Kepayang Digital Estate System v6.2</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:Arial,sans-serif;background:#0b1812;color:#fff}
body{overflow:hidden}
#app{position:fixed;inset:0;background:#0b1812}
.view{position:absolute;inset:0 0 64px 0;display:none;background:#0b1812}
.view.active{display:block}
.view iframe{width:100%;height:100%;border:0;background:#0b1812}
.topbar{position:fixed;z-index:200;left:12px;top:12px;background:rgba(8,15,12,.94);padding:8px 11px;border-radius:12px;box-shadow:0 4px 16px #0006;pointer-events:none}
.topbar b{display:block;font-size:13px}.topbar span{font-size:10px;color:#cbd5d0}
.nav{position:fixed;z-index:300;left:10px;right:10px;bottom:8px;height:50px;background:rgba(8,15,12,.97);border-radius:15px;padding:5px;display:grid;grid-template-columns:repeat(5,1fr);gap:5px;box-shadow:0 5px 22px #0008}
.nav button{border:0;border-radius:10px;background:#1a2b24;color:#e8eeeb;font-weight:800;font-size:11px;cursor:pointer}
.nav button.active{background:#d6a03a;color:#172219}
.status{position:fixed;z-index:250;right:12px;top:12px;background:rgba(8,15,12,.9);padding:7px 9px;border-radius:10px;font-size:10px;color:#d8e1dc}
@media(max-width:700px){.topbar{left:8px;top:8px;max-width:65%}.topbar b{font-size:12px}.status{right:8px;top:8px}.nav{left:8px;right:8px;bottom:7px;height:52px}.nav button{font-size:9px;padding:4px}.view{inset:0 0 66px 0}}
</style>
</head>
<body>
<div id="app"><div class="topbar"><b>FELDA Bukit Kepayang Digital Estate System</b><span>Production HD v6.2</span></div><div id="status" class="status">Backup v6.2</div></div>
</body></html>
