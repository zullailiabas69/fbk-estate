<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1812"><title>FELDA Bukit Kepayang — Isu Lapangan v5.5</title><style>*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:Arial,sans-serif;background:#0b1812}#base{position:fixed;inset:0;width:100%;height:100%;border:0}.issueBtn{position:fixed;z-index:60;right:12px;bottom:14px;border:0;border-radius:999px;padding:11px 15px;background:#d6a03a;color:#172219;font-weight:800;box-shadow:0 5px 18px #0007;cursor:pointer}.panel{position:fixed;z-index:70;top:10px;right:10px;width:min(390px,calc(100% - 20px));max-height:calc(100% - 20px);overflow:auto;background:rgba(8,15,12,.97);color:#fff;border-radius:14px;padding:12px;box-shadow:0 8px 24px #0006;display:none}.panel.open{display:block}.top{display:flex;align-items:center;justify-content:space-between;gap:8px}.top h1{font-size:17px;margin:0}.small{font-size:11px;line-height:1.4;color:#d8e1dc}.card,.issue{background:#15251f;border-radius:10px;padding:9px;margin:8px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.grid .card{text-align:center;margin:0}.grid strong{display:block;font-size:20px}input,select,textarea{width:100%;margin:4px 0 8px;padding:8px;border-radius:8px;border:1px solid #385247;background:#102019;color:#fff}textarea{min-height:66px}button{border:0;border-radius:9px;padding:8px 9px;font-weight:700;cursor:pointer}.gold{background:#d6a03a}.blue{background:#2277b7;color:#fff}.green{background:#2d7d4d;color:#fff}.red{background:#7a2d2d;color:#fff}.toolbar{display:flex;gap:6px;flex-wrap:wrap;margin:7px 0}.issue{border-left:4px solid #f1c40f}.issue.high{border-left-color:#e74c3c}.issue.low{border-left-color:#3498db}.pill{display:inline-block;padding:2px 6px;border-radius:999px;font-size:9px;background:#294238;margin-right:4px}.photo{width:100%;max-height:180px;object-fit:cover;border-radius:8px;margin-top:7px}.preview{width:100%;max-height:180px;object-fit:cover;border-radius:8px;margin:5px 0;display:none}.status{position:fixed;z-index:80;left:50%;bottom:12px;transform:translateX(-50%);background:#08100dea;color:#fff;padding:8px 12px;border-radius:999px;font-size:11px;pointer-events:none}@media(max-width:950px){.panel{left:8px;right:8px;top:8px;width:auto;max-height:calc(100% - 76px)}.issueBtn{right:12px;bottom:12px}.status{bottom:62px;left:8px;right:8px;transform:none;text-align:center;border-radius:10px}}</style></head><body><iframe id="base" src="./?v=54" title="FELDA Bukit Kepayang Digital Estate System"></iframe><button class="issueBtn" onclick="togglePanel()">⚠ Isu Lapangan</button><section id="panel" class="panel"><div class="top"><h1>Isu & Bukti Lapangan v5.5</h1><button onclick="togglePanel()">Tutup</button></div><div class="small">Peta, routing, GPS dan Operasi v5.4 kekal di bawah. Modul ini hanya menambah rekod isu lapangan.</div><div class="grid"><div class="card"><strong id="iOpen">0</strong><span class="small">Terbuka</span></div><div class="card"><strong id="iHigh">0</strong><span class="small">Tinggi</span></div><div class="card"><strong id="iDone">0</strong><span class="small">Selesai</span></div></div><h2 style="font-size:15px">Rekod Isu</h2><div class="card"><input id="editId" type="hidden"><label class="small">Blok/Lot / Lokasi</label><input id="lot" placeholder="Contoh: Blok 3 / Jalan utama"><label class="small">Kategori</label><select id="type"><option>Jalan ladang</option><option>Parit/saliran</option><option>Pokok/tanaman</option><option>Jambatan/culvert</option><option>Keselamatan</option><option>Mesin/peralatan</option><option>Lain-lain</option></select><label class="small">Keutamaan</label><select id="priority"><option>Tinggi</option><option selected>Sederhana</option><option>Rendah</option></select><label class="small">Status</label><select id="st"><option>Baru</option><option>Dalam tindakan</option><option>Selesai</option></select><label class="small">Catatan</label><textarea id="note" placeholder="Terangkan isu dan tindakan diperlukan"></textarea><label class="small">Foto bukti</label><input id="photo" type="file" accept="image/*" capture="environment"><img id="preview" class="preview" alt="Pratonton foto"><div class="toolbar"><button class="blue" onclick="getGps()">Guna GPS Semasa</button><button class="green" onclick="saveIssue()">Simpan Isu</button><button onclick="resetForm()">Kosongkan</button></div><div id="gpsInfo" class="small">GPS isu belum dipilih.</div></div><h2 style="font-size:15px">Isu Terkini</h2><div id="list"></div><div class="toolbar"><button onclick="exportIssues()">Eksport Isu JSON</button></div></section><div id="status" class="status">v5.5 sedia.</div><script>const KEY='fbk_issues_v55';let issues=[];try{issues=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){}let gps=null,pending=null;const el=id=>document.getElementById(id);function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function togglePanel(){el('panel').classList.toggle('open');render()}function getGps(){if(!navigator.geolocation){el('status').textContent='GPS tidak disokong.';return}el('status').textContent='Mencari GPS…';navigator.geolocation.getCurrentPosition(p=>{gps={lat:p.coords.latitude,lng:p.coords.longitude};el('gpsInfo').textContent='GPS isu: '+gps.lat.toFixed(6)+', '+gps.lng.toFixed(6);el('status').textContent='GPS isu dijumpai.'},e=>el('status').textContent='GPS gagal: '+e.message,{enableHighAccuracy:true,timeout:15000})}async function compress(file){return new Promise((ok,no)=>{const r=new FileReader();r.onerror=()=>no(Error('Foto gagal dibaca'));r.onload=()=>{const im=new Image();im.onerror=()=>no(Error('Foto gagal diproses'));im.onload=()=>{const max=1000,sc=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*sc));c.height=Math.max(1,Math.round(im.height*sc));c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.65))};im.src=r.result};r.readAsDataURL(file)})}el('photo').addEventListener('change',async e=>{const f=e.target.files&&e.target.files[0];if(!f){pending=null;el('preview').style.display='none';return}el('status').textContent='Memproses foto…';try{pending=await compress(f);el('preview').src=pending;el('preview').style.display='block';el('status').textContent='Foto sedia disimpan.'}catch(err){el('status').textContent=err.message}});function saveStore(next){try{localStorage.setItem(KEY,JSON.stringify(next));issues=next;render();return true}catch(e){el('status').textContent='Storan foto penuh. Cuba foto lebih kecil atau padam foto lama.';return false}}function saveIssue(){const id=el('editId').value,old=id?issues.find(x=>x.id===id):null,obj={id:id||String(Date.now()),lot:el('lot').value.trim(),type:el('type').value,priority:el('priority').value,status:el('st').value,note:el('note').value.trim(),lat:gps?gps.lat:(old?old.lat:null),lng:gps?gps.lng:(old?old.lng:null),photo:pending!==null?pending:(old?old.photo:null),created:old?old.created:new Date().toISOString(),updated:new Date().toISOString()};if(!obj.lot&&!obj.note){el('status').textContent='Isi lokasi atau catatan dahulu.';return}const next=id?issues.map(x=>x.id===id?obj:x):[...issues,obj];if(saveStore(next)){resetForm();el('status').textContent=id?'Isu dikemaskini.':'Isu berjaya disimpan.'}}function resetForm(){el('editId').value='';el('lot').value='';el('type').value='Jalan ladang';el('priority').value='Sederhana';el('st').value='Baru';el('note').value='';el('photo').value='';el('preview').style.display='none';el('preview').removeAttribute('src');el('gpsInfo').textContent='GPS isu belum dipilih.';gps=null;pending=null}function render(){el('iOpen').textContent=issues.filter(x=>x.status!=='Selesai').length;el('iHigh').textContent=issues.filter(x=>x.priority==='Tinggi'&&x.status!=='Selesai').length;el('iDone').textContent=issues.filter(x=>x.status==='Selesai').length;el('list').innerHTML=issues.length?issues.slice().reverse().map(x=>`<div class="issue ${x.priority==='Tinggi'?'high':x.priority==='Rendah'?'low':''}"><b>${esc(x.lot||'Lokasi tidak dinyatakan')} — ${esc(x.type)}</b><div class="small"><span class="pill">${esc(x.priority)}</span><span class="pill">${esc(x.status)}</span></div>${x.note?`<div class="small" style="margin-top:5px">${esc(x.note)}</div>`:''}${Number.isFinite(x.lat)&&Number.isFinite(x.lng)?`<div class="small">${x.lat.toFixed(6)}, ${x.lng.toFixed(6)}</div>`:''}${x.photo?`<img class="photo" src="${x.photo}" alt="Foto bukti isu">`:''}<div class="toolbar"><button onclick="editIssue('${x.id}')">Edit</button><button class="red" onclick="delIssue('${x.id}')">Padam</button></div></div>`).join(''):'<div class="small">Belum ada isu direkodkan.</div>'}function editIssue(id){const x=issues.find(r=>r.id===id);if(!x)return;el('editId').value=x.id;el('lot').value=x.lot||'';el('type').value=x.type||'Lain-lain';el('priority').value=x.priority||'Sederhana';el('st').value=x.status||'Baru';el('note').value=x.note||'';gps=Number.isFinite(x.lat)&&Number.isFinite(x.lng)?{lat:x.lat,lng:x.lng}:null;pending=x.photo||null;el('gpsInfo').textContent=gps?'GPS isu: '+gps.lat.toFixed(6)+', '+gps.lng.toFixed(6):'GPS isu belum dipilih.';if(pending){el('preview').src=pending;el('preview').style.display='block'}else el('preview').style.display='none';el('status').textContent='Mod edit isu.'}function delIssue(id){if(confirm('Padam isu ini?'))saveStore(issues.filter(x=>x.id!==id))}function exportIssues(){const clean=issues.map(x=>({...x,photo:x.photo?'[foto disimpan dalam peranti]':null})),blob=new Blob([JSON.stringify({version:'5.5',exported_at:new Date().toISOString(),issues:clean},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='fbk-isu-lapangan-v55.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}render();</script></body></html>
