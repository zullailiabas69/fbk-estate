)">Garis Tebal</button><div class="sub">Cubit dua jari untuk zoom, seret untuk bergerak, atau guna butang − / +. Tekan nombor lot untuk tindakan. <span class="warn">Garisan & nombor datang daripada peta A0 diperbaiki; belum disahkan sebagai sempadan rasmi.</span></div></div><div id="stage"><svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg></div><div id="loader">Memuat peta lot bersih…</div><div id="badge">Sedia memuat</div><div id="zoom"><button aria-label="Zoom keluar" onclick="zoomBy(1/1.45)">−</button><button aria-label="Penuh" onclick="fit()">⌂</button><button aria-label="Zoom masuk" onclick="zoomBy(1.45)">+</button></div><div id="pick"><b id="picked">Lot</b><button class="work" onclick="recordWork(event)">Rekod Kerja</button><button class="history" onclick="showHistory(event)">Lihat Rekod Lot</button><button class="cancel" onclick="clearPick(event)">Batal</button></div><div id="modal"><div id="panel"><div id="panelHead"><h2 id="histTitle">Rekod Lot</h2><button onclick="closeHistory()">Tutup</button></div><div id="histList"></div></div></div><script>const KEY='fbk_ops_v54',stage=document.getElementById('stage'),svg=document.getElementById('svg'),loader=document.getElementById('loader'),badge=document.getElementById('badge'),pick=document.getElementById('pick'),picked=document.getElementById('picked'),modal=document.getElementById('modal'),histTitle=document.getElementById('histTitle'),histList=document.getElementById('histList');let scale=1,fitScale=1,x=0,y=0,labelMul=1.3,showBlock=false,thick=false,W=3370.5,H=2384,selected='';const pts=new Map();let panStart=null,pinchStart=null,lastTap=0;function u8FromB64(s){const r=atob(s),a=new Uint8Array(r.length);for(let i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a}async function gunzip(a){const ds=new DecompressionStream('gzip');return new Uint8Array(await new Response(new Blob([a]).stream().pipeThrough(ds)).arrayBuffer())}function reader(a){let i=0;return{byte(){return a[i++]},varint(){let n=0,s=0,b;do{b=a[i++];n|=(b&127)<<s;s+=7}while(b&128);return n>>>0},str(n){let s='';while(n--)s+=String.fromCharCode(a[i++]);return s}}}function zz(n){return(n>>>1)^-(n&1)}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function readOps(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return[]}}async function load(){try{const parts=await Promise.all([0,1,2,3,4].map(n=>fetch('v82/lot0'+n+'?v=88',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('lot0'+n+' HTTP '+r.status);return r.text()})));const raw=await gunzip(u8FromB64(parts.join('').replace(/\s+/g,'')));const r=reader(raw);if(String.fromCharCode(r.byte(),r.byte())!=='L2')throw Error('format data');const Q=2,wq=r.varint(),hq=r.varint(),nl=r.varint();W=wq/Q;H=hq/Q;svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.setAttribute('width',W);svg.setAttribute('height',H);let px=0,py=0;const frag=document.createDocumentFragment();for(let k=0;k<nl;k++){const n=r.varint();let d='';for(let j=0;j<n;j++){px+=zz(r.varint());py+=zz(r.varint());const xx=px/Q,yy=py/Q;d+=(j?'L':'M')+xx+' '+yy}const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',d);p.setAttribute('class','lotline');frag.appendChild(p)}svg.appendChild(frag);const nt=r.varint();px=0;py=0;const tf=document.createDocumentFragment();let lots=0;for(let k=0;k<nt;k++){const sl=r.varint(),txt=r.str(sl);px+=zz(r.varint());py+=zz(r.varint());const sz=r.varint()/Q;const t=document.createElementNS('http://www.w3.org/2000/svg','text');t.textContent=txt;t.setAttribute('x',px/Q);t.setAttribute('y',py/Q);t.dataset.base=sz;t.setAttribute('class',txt.length===4?'lotnum':'blockcode hide');if(txt.length===4)lots++;tf.appendChild(t)}svg.appendChild(tf);applyLabelScale();loader.style.display='none';badge.textContent=`${lots} nombor lot · cubit dua jari untuk zoom`;requestAnimationFrame(fit)}catch(e){loader.textContent='Peta gagal dimuat: '+e.message;badge.textContent='Ralat data'}}function apply(){svg.style.transform=`translate(calc(-50% + ${x}px),calc(-50% + ${y}px)) scale(${scale})`}function fit(){const pad=20,top=112,sw=(innerWidth-pad*2)/W,sh=(innerHeight-top-pad)/H;fitScale=Math.min(sw,sh);scale=fitScale;x=0;y=top*.18;apply();badge.textContent='Peta penuh · cubit dua jari untuk zoom'}function setScale(s){scale=Math.max(fitScale*.65,Math.min(fitScale*30,s));apply();badge.textContent='Zoom '+Math.round(scale/fitScale*100)+'% · seret untuk bergerak'}function zoomBy(f){setScale(scale*f)}function labelScale(m){labelMul=m;['b100','b130','b160'].forEach(id=>document.getElementById(id).classList.remove('on'));document.getElementById(m===1?'b100':m===1.3?'b130':'b160').classList.add('on');applyLabelScale()}function applyLabelScale(){document.querySelectorAll('.lotnum,.blockcode').forEach(t=>{const b=+t.dataset.base||12.5;t.setAttribute('font-size',Math.max(9,b*labelMul))})}function toggleBlock(){showBlock=!showBlock;document.getElementById('bBlock').classList.toggle('on',showBlock);document.querySelectorAll('.blockcode').forEach(t=>t.classList.toggle('hide',!showBlock))}function toggleLine(){thick=!thick;document.getElementById('bLine').classList.toggle('on',thick);document.querySelectorAll('.lotline').forEach(p=>p.style.strokeWidth=thick?'1.25':'.75')}function chooseLot(t){document.querySelectorAll('.lotnum.selected').forEach(n=>n.classList.remove('selected'));t.classList.add('selected');selected=t.textContent.trim();picked.textContent='Lot '+selected;pick.style.display='flex';badge.textContent='Lot '+selected+' dipilih'}function clearPick(e){if(e)e.stopPropagation();selected='';pick.style.display='none';document.querySelectorAll('.lotnum.selected').forEach(n=>n.classList.remove('selected'));badge.textContent='Tekan nombor lot untuk pilih'}function recordWork(e){if(e)e.stopPropagation();if(!selected)return;parent.postMessage({type:'fbk-record-lot',lot:selected},location.origin)}function showHistory(e){if(e)e.stopPropagation();if(!selected)return;const key='Lot '+selected;const a=readOps().filter(r=>String(r.lot||'').trim().toLowerCase()===key.toLowerCase()).sort((a,b)=>String(b.workDate||b.date||b.updated||b.created||'').localeCompare(String(a.workDate||a.date||a.updated||a.created||'')));histTitle.textContent='Rekod Lot '+selected;histList.innerHTML=a.length?a.map(r=>`<div class="rec"><b>${esc(r.type||'Kerja')}</b> · ${esc(r.status||'')}<div class="meta">${esc(r.workDate||r.date||'')}${r.note?' · '+esc(r.note):''}</div></div>`).join(''):'<div class="empty">Belum ada rekod untuk Lot '+esc(selected)+'.</div>';modal.style.display='flex'}function closeHistory(){modal.style.display='none'}modal.addEventListener('click',e=>{if(e.target===modal)closeHistory()});stage.addEventListener('wheel',e=>{e.preventDefault();zoomBy(e.deltaY<0?1.18:1/1.18)},{passive:false});function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function mid(a,b){return{x:(a.x+b.x)/2,y:(a.y+b.y)/2}}stage.addEventListener('pointerdown',e=>{const t=e.target.closest&&e.target.closest('.lotnum');pts.set(e.pointerId,{x:e.clientX,y:e.clientY});try{stage.setPointerCapture(e.pointerId)}catch(_){}if(pts.size===1){panStart={px:e.clientX,py:e.clientY,x,y,moved:false,target:t}}else if(pts.size===2){const a=[...pts.values()],m=mid(a[0],a[1]);pinchStart={d:Math.max(1,dist(a[0],a[1])),scale,x,y,mx:m.x,my:m.y};panStart=null;stage.classList.add('drag')}e.preventDefault()});stage.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pts.size>=2&&pinchStart){const a=[...pts.values()].slice(0,2),m=mid(a[0],a[1]),ratio=dist(a[0],a[1])/pinchStart.d;scale=Math.max(fitScale*.65,Math.min(fitScale*30,pinchStart.scale*ratio));x=pinchStart.x+(m.x-pinchStart.mx);y=pinchStart.y+(m.y-pinchStart.my);apply();badge.textContent='Zoom '+Math.round(scale/fitScale*100)+'%';return}if(pts.size===1&&panStart){const dx=e.clientX-panStart.px,dy=e.clientY-panStart.py;if(Math.hypot(dx,dy)>6)panStart.moved=true;x=panStart.x+dx;y=panStart.y+dy;apply();stage.classList.add('drag')}});function pointerEnd(e){const was=panStart;pts.delete(e.pointerId);if(pts.size<2)pinchStart=null;if(pts.size===1){const p=[...pts.values()][0];panStart={px:p.x,py:p.y,x,y,moved:true,target:null}}else if(pts.size===0){stage.classList.remove('drag');if(was&&!was.moved&&was.target)chooseLot(was.target);panStart=null}e.preventDefault()}stage.addEventListener('pointerup',pointerEnd);stage.addEventListener('pointercancel',pointerEnd);stage.addEventListener('dblclick',e=>{e.preventDefault();zoomBy(1.6)});stage.addEventListener('touchend',e=>{if(e.touches.length)return;const now=Date.now();if(now-lastTap<320){zoomBy(1.6);lastTap=0}else lastTap=now},{passive:true});window.addEventListener('resize',fit);load();</script></body></html>
