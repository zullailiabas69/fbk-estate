<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-store"><title>FBK Standalone Vector v6.8</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#d6dfd4;font-family:Arial,sans-serif}#stage{position:fixed;inset:0;overflow:hidden;touch-action:none;cursor:grab}#tiles{position:absolute;inset:0}.tile{position:absolute;width:256px;height:256px;user-select:none;-webkit-user-drag:none}#vec{position:absolute;pointer-events:none;overflow:hidden;shape-rendering:geometricPrecision;text-rendering:geometricPrecision}#overlay{position:absolute;inset:0;pointer-events:none}.panel{position:fixed;z-index:20;top:10px;left:10px;width:min(440px,calc(100% - 20px));background:#08100dee;color:#fff;border-radius:14px;padding:10px;box-shadow:0 6px 20px #0006}.panel b{font-size:15px}.small{font-size:11px;color:#d7e0db;line-height:1.4}.toolbar{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}button{border:0;border-radius:9px;padding:8px 10px;font-weight:700;cursor:pointer}.gold{background:#d6a03a;color:#172219}#zoom{position:fixed;z-index:21;left:12px;bottom:15px;display:flex;flex-direction:column;gap:5px}#zoom button{width:42px;height:42px;background:#fff;font-size:22px}.marker{position:absolute;transform:translate(-50%,-50%);width:22px;height:22px;border-radius:50%;border:3px solid white;box-shadow:0 2px 8px #0008}.label{position:absolute;transform:translate(-50%,14px);background:#fff;color:#172219;padding:3px 6px;border-radius:7px;font-size:10px;white-space:nowrap}.status{position:fixed;z-index:21;right:10px;bottom:10px;background:#08100dee;color:#fff;padding:7px 9px;border-radius:9px;font-size:10px}</style></head><body><div id="stage"><div id="tiles"></div><svg id="vec" xmlns="http://www.w3.org/2000/svg" viewBox="108 108 4552 6526" preserveAspectRatio="none"></svg><div id="overlay"></div></div><div class="panel"><b>FBK Standalone Vector v6.8</b><div class="small">Ujian terus tanpa iframe dan tanpa raster GeoPDF. Hanya OSM + garisan/teks vektor asal yang telah diekstrak.</div><div class="toolbar"><button class="gold" onclick="focusSettlement()">Penempatan</button><button onclick="focusFull()">FELDA Penuh</button><button onclick="setMode('hybrid')">Hybrid</button><button onclick="setMode('vector')">Vektor sahaja</button><button onclick="setMode('osm')">OSM sahaja</button></div></div><div id="zoom"><button onclick="zoomBy(1)">＋</button><button onclick="zoomBy(-1)">−</button></div><div id="status" class="status">Memuat vektor…</div><script>const B={left:102.574338999979,right:102.645916999087,top:3.380043596679,bottom:3.277425402};const P={home:{name:'Rumah',lat:3.33673797,lng:102.61342745,c:'#d6a03a'},masjid:{name:'Masjid',lat:3.33581846,lng:102.6110772,c:'#2d7d4d'},office:{name:'Pejabat FELDA',lat:3.33890128,lng:102.60955755,c:'#2277b7'},school:{name:'Sekolah',lat:3.33790094,lng:102.60956536,c:'#8e44ad'}};const TILE=256,stage=document.getElementById('stage'),tiles=document.getElementById('tiles'),svg=document.getElementById('vec'),ov=document.getElementById('overlay'),statusEl=document.getElementById('status');let center={lat:3.3374,lng:102.6108},zoom=16,mode='hybrid',ready=false;function lon2x(lon,z){return(lon+180)/360*TILE*2**z}function lat2y(lat,z){const r=lat*Math.PI/180,n=2**z;return(1-Math.asinh(Math.tan(r))/Math.PI)/2*TILE*n}function x2lon(x,z){return x/(TILE*2**z)*360-180}function y2lat(y,z){const n=Math.PI-2*Math.PI*y/(TILE*2**z);return 180/Math.PI*Math.atan(Math.sinh(n))}function xy(lat,lng){const cx=lon2x(center.lng,zoom),cy=lat2y(center.lat,zoom);return{x:lon2x(lng,zoom)-cx+innerWidth/2,y:lat2y(lat,zoom)-cy+innerHeight/2}}function drawTiles(){tiles.innerHTML='';if(mode==='vector')return;const cx=lon2x(center.lng,zoom),cy=lat2y(center.lat,zoom),minX=Math.floor((cx-innerWidth/2)/TILE)-1,maxX=Math.floor((cx+innerWidth/2)/TILE)+1,minY=Math.floor((cy-innerHeight/2)/TILE)-1,maxY=Math.floor((cy+innerHeight/2)/TILE)+1,n=2**zoom;for(let tx=minX;tx<=maxX;tx++)for(let ty=minY;ty<=maxY;ty++){if(ty<0||ty>=n)continue;const im=document.createElement('img');im.className='tile';im.src=`https://tile.openstreetmap.org/${zoom}/${((tx%n)+n)%n}/${ty}.png`;im.style.left=(tx*TILE-cx+innerWidth/2)+'px';im.style.top=(ty*TILE-cy+innerHeight/2)+'px';tiles.appendChild(im)}}function positionVector(){if(!ready||mode==='osm'){svg.style.display='none';return}const tl=xy(B.top,B.left),br=xy(B.bottom,B.right);svg.style.display='block';svg.style.left=tl.x+'px';svg.style.top=tl.y+'px';svg.style.width=(br.x-tl.x)+'px';svg.style.height=(br.y-tl.y)+'px';svg.style.opacity=mode==='hybrid'?'.96':'1'}function drawOverlay(){ov.innerHTML='';for(const p of Object.values(P)){const q=xy(p.lat,p.lng);if(q.x<-80||q.x>innerWidth+80||q.y<-80||q.y>innerHeight+80)continue;const m=document.createElement('div');m.className='marker';m.style.left=q.x+'px';m.style.top=q.y+'px';m.style.background=p.c;ov.appendChild(m);const l=document.createElement('div');l.className='label';l.style.left=q.x+'px';l.style.top=q.y+'px';l.textContent=p.name;ov.appendChild(l)}}function render(){drawTiles();positionVector();drawOverlay();statusEl.textContent=ready?`Vektor terus · zoom ${zoom}`:'Memuat vektor…'}function pathD(subs){let d='';for(const a of subs){if(a.length<4)continue;d+='M'+a[0]+' '+a[1];for(let i=2;i<a.length;i+=2)d+='L'+a[i]+' '+a[i+1]}return d}async function gunzipB64(s){const bin=atob(s.replace(/\s+/g,'')),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);const ds=new DecompressionStream('gzip');return new Response(new Blob([u]).stream().pipeThrough(ds)).json()}async function loadVector(){try{const b64=await fetch('v64/overlay.b64?v=68',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('overlay HTTP '+r.status);return r.text()}),data=await gunzipB64(b64),ns='http://www.w3.org/2000/svg',frag=document.createDocumentFragment();for(const item of data.p){const st=data.s[item[0]],p=document.createElementNS(ns,'path');p.setAttribute('d',pathD(item[1]));p.setAttribute('fill','none');p.setAttribute('stroke','#'+st[0]);p.setAttribute('stroke-width',String(Math.max(.45,st[1]*2)));p.setAttribute('stroke-opacity',String(st[2]??1));p.setAttribute('stroke-linejoin','round');p.setAttribute('stroke-linecap','round');frag.appendChild(p)}for(const t of data.t){const e=document.createElementNS(ns,'text'),fs=t[2]*2;e.setAttribute('x',t[0]);e.setAttribute('y',t[1]+fs*.82);e.setAttribute('font-size',fs);e.setAttribute('font-family','Arial,sans-serif');e.setAttribute('fill','#'+(t[3]||'000000'));e.setAttribute('font-weight','600');e.setAttribute('text-rendering','geometricPrecision');e.textContent=t[4];frag.appendChild(e)}svg.appendChild(frag);ready=true;render()}catch(e){statusEl.textContent='Vektor gagal: '+e.message}}window.focusSettlement=()=>{center={lat:3.3374,lng:102.6108};zoom=17;render()};window.focusFull=()=>{center={lat:(B.top+B.bottom)/2,lng:(B.left+B.right)/2};zoom=13;render()};window.setMode=m=>{mode=m;render()};window.zoomBy=d=>{zoom=Math.max(11,Math.min(20,zoom+d));render()};let drag=null;stage.addEventListener('pointerdown',e=>{if(e.target.closest('button')||e.target.closest('.panel'))return;drag={x:e.clientX,y:e.clientY,cx:lon2x(center.lng,zoom),cy:lat2y(center.lat,zoom)};stage.setPointerCapture(e.pointerId)});stage.addEventListener('pointermove',e=>{if(!drag)return;const wx=drag.cx-(e.clientX-drag.x),wy=drag.cy-(e.clientY-drag.y);center={lng:x2lon(wx,zoom),lat:y2lat(wy,zoom)};render()});stage.addEventListener('pointerup',()=>drag=null);stage.addEventListener('pointercancel',()=>drag=null);stage.addEventListener('wheel',e=>{e.preventDefault();window.zoomBy(e.deltaY<0?1:-1)},{passive:false});window.addEventListener('resize',render);loadVector();render();</script></body></html>
