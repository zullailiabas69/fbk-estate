<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1812"><title>FELDA Bukit Kepayang Digital Estate System v6.0</title><style>*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:Arial,sans-serif;background:#0b1812;color:#fff;overflow:hidden}.view{position:absolute;inset:0 0 64px;display:none}.view.active{display:block}.view iframe{width:100%;height:100%;border:0}.top{position:fixed;z-index:200;left:12px;top:12px;background:#08100dee;padding:8px 11px;border-radius:12px;box-shadow:0 4px 16px #0006;pointer-events:none}.top b{display:block;font-size:13px}.top span{font-size:10px;color:#cbd5d0}.status{position:fixed;z-index:210;right:12px;top:12px;background:#08100de8;padding:7px 9px;border-radius:10px;font-size:10px}.nav{position:fixed;z-index:300;left:10px;right:10px;bottom:8px;height:50px;background:#08100df7;border-radius:15px;padding:5px;display:grid;grid-template-columns:repeat(5,1fr);gap:5px;box-shadow:0 5px 22px #0008}.nav button{border:0;border-radius:10px;background:#1a2b24;color:#e8eeeb;font-weight:800;font-size:11px}.nav button.active{background:#d6a03a;color:#172219}@media(max-width:700px){.top{left:8px;top:8px;max-width:65%}.top b{font-size:12px}.status{right:8px;top:8px}.nav{left:8px;right:8px;bottom:7px;height:52px}.nav button{font-size:9px;padding:4px}.view{inset:0 0 66px}}</style></head><body><div class="top"><b>FELDA Bukit Kepayang Digital Estate System</b><span>Hybrid HD Test v6.0</span></div><div id="status" class="status">Peta HD</div><div id="mapView" class="view active"><iframe id="mapFrame" src="v60base.html?v=60-map"></iframe></div><div id="opsView" class="view"><iframe id="opsFrame" src="v60base.html?v=60-ops"></iframe></div><div id="issueView" class="view"><iframe id="issueFrame" src="v55.html?v=60"></iframe></div><div id="reportView" class="view"><iframe id="reportFrame" src="v56.html?v=60"></iframe></div><div id="gpsView" class="view"><iframe id="gpsFrame" src="v60base.html?v=60-gps"></iframe></div><div class="nav"><button id="nMap" class="active" onclick="show('map')">🗺️<br>Peta</button><button id="nOps" onclick="show('ops')">🧾<br>Operasi</button><button id="nIssue" onclick="show('issue')">⚠️<br>Isu</button><button id="nReport" onclick="show('report')">📊<br>Laporan</button><button id="nGps" onclick="show('gps')">📍<br>GPS</button></div><script>const V={map:'mapView',ops:'opsView',issue:'issueView',report:'reportView',gps:'gpsView'},N={map:'nMap',ops:'nOps',issue:'nIssue',report:'nReport',gps:'nGps'},L={map:'Peta HD',ops:'Operasi',issue:'Isu',report:'Laporan & Backup',gps:'GPS'};function show(n){Object.values(V).forEach(x=>document.getElementById(x).classList.remove('active'));Object.values(N).forEach(x=>document.getElementById(x).classList.remove('active'));document.getElementById(V[n]).classList.add('active');document.getElementById(N[n]).classList.add('active');document.getElementById('status').textContent=L[n];if(n==='ops')setTimeout(()=>{try{document.getElementById('opsFrame').contentWindow.openOps()}catch(e){}},150);if(n==='issue')setTimeout(()=>{try{const f=document.getElementById('issueFrame'),p=f.contentDocument.getElementById('panel');if(p&&!p.classList.contains('open'))f.contentWindow.togglePanel()}catch(e){}},150);if(n==='report')setTimeout(()=>{try{const f=document.getElementById('reportFrame'),p=f.contentDocument.getElementById('panel');if(p&&!p.classList.contains('open'))f.contentWindow.togglePanel()}catch(e){}},150);if(n==='gps')setTimeout(()=>{try{document.getElementById('gpsFrame').contentWindow.locateMe()}catch(e){}},150)}</script></body></html>
