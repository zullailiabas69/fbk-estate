<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1812">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FBK Estate">
<link rel="manifest" href="manifest.webmanifest?v=73">
<title>FELDA Bukit Kepayang Digital Estate System</title>
<script>if(new URLSearchParams(location.search).get('v')==='54'){location.replace('v72.html?v=73-base')}</script>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:Arial,sans-serif;background:#0b1812;color:#fff}body{overflow:hidden}
#app{position:fixed;inset:0;background:#0b1812}.view{position:absolute;inset:0 0 64px 0;display:none;background:#0b1812}.view.active{display:block}.view iframe{width:100%;height:100%;border:0;background:#0b1812}
.topbar{position:fixed;z-index:200;left:12px;top:12px;background:rgba(8,15,12,.94);padding:8px 11px;border-radius:12px;box-shadow:0 4px 16px #0006;pointer-events:none}.topbar b{display:block;font-size:13px}.topbar span{font-size:10px;color:#cbd5d0}
.nav{position:fixed;z-index:300;left:10px;right:10px;bottom:8px;height:50px;background:rgba(8,15,12,.97);border-radius:15px;padding:5px;display:grid;grid-template-columns:repeat(5,1fr);gap:5px;box-shadow:0 5px 22px #0008}.nav button{border:0;border-radius:10px;background:#1a2b24;color:#e8eeeb;font-weight:800;font-size:11px;cursor:pointer}.nav button.active{background:#d6a03a;color:#172219}
.status{position:fixed;z-index:250;right:12px;top:12px;background:rgba(8,15,12,.92);padding:7px 9px;border:0;border-radius:10px;font-size:10px;color:#d8e1dc;cursor:pointer}.install{display:none;position:fixed;z-index:260;right:12px;top:48px;border:0;border-radius:10px;padding:7px 10px;background:#2d7d4d;color:#fff;font-weight:800;cursor:pointer}
@media(max-width:700px){.topbar{left:8px;top:8px;max-width:65%}.topbar b{font-size:12px}.status{right:8px;top:8px}.install{right:8px;top:46px}.nav{left:8px;right:8px;bottom:7px;height:52px}.nav button{font-size:9px;padding:4px}.view{inset:0 0 66px 0}}
</style>
</head><body><div id="app">
<div class="topbar"><b>FELDA Bukit Kepayang Digital Estate System</b><span>Production Stable Hybrid v7.3</span></div>
<button id="status" class="status" onclick="systemStatus()">Peta Hybrid</button><button id="installBtn" class="install" onclick="installApp()">Pasang App</button>
<div id="mapView" class="view active"><iframe id="mapFrame" src="v72.html?v=73-map" title="Peta FELDA"></iframe></div>
<div id="opsView" class="view"><iframe id="opsFrame" src="v72.html?v=73-ops" title="Operasi Ladang"></iframe></div>
<div id="issueView" class="view"><iframe id="issueFrame" src="v55.html?v=73" title="Isu Lapangan"></iframe></div>
<div id="reportView" class="view"><iframe id="reportFrame" src="v56.html?v=73" title="Laporan dan Backup"></iframe></div>
<div id="gpsView" class="view"><iframe id="gpsFrame" src="v72.html?v=73-gps" title="GPS"></iframe></div>
<div class="nav"><button id="nMap" class="active" onclick="showView('map')">🗺️<br>Peta</button><button id="nOps" onclick="showView('ops')">🧾<br>Operasi</button><button id="nIssue" onclick="showView('issue')">⚠️<br>Isu</button><button id="nReport" onclick="showView('report')">📊<br>Laporan</button><button id="nGps" onclick="showView('gps')">📍<br>GPS</button></div>
</div>
<script>
const views={map:'mapView',ops:'opsView',issue:'issueView',report:'reportView',gps:'gpsView'},navs={map:'nMap',ops:'nOps',issue:'nIssue',report:'nReport',gps:'nGps'},labels={map:'Peta Hybrid',ops:'Operasi',issue:'Isu Lapangan',report:'Laporan & Backup',gps:'GPS'};
function hidePanels(frame){try{const w=frame.contentWindow,d=frame.contentDocument;if(w.closeOps)w.closeOps();const p=d&&d.getElementById('panel');if(p)p.classList.remove('open')}catch(e){}}
function repairNested(doc){try{if(!doc)return;doc.querySelectorAll('iframe').forEach(f=>{const src=f.getAttribute('src')||'';if(src.includes('./?v=54')||src==='./?v=54')f.src='v72.html?v=73-base';try{repairNested(f.contentDocument)}catch(e){}})}catch(e){}}
function showView(name){Object.values(views).forEach(id=>document.getElementById(id).classList.remove('active'));Object.values(navs).forEach(id=>document.getElementById(id).classList.remove('active'));document.getElementById(views[name]).classList.add('active');document.getElementById(navs[name]).classList.add('active');document.getElementById('status').textContent=labels[name];if(name==='map'){hidePanels(document.getElementById('mapFrame'))}if(name==='ops'){const f=document.getElementById('opsFrame');setTimeout(()=>{try{if(f.contentWindow.openOps)f.contentWindow.openOps()}catch(e){}},120)}if(name==='issue'){const f=document.getElementById('issueFrame');setTimeout(()=>{try{repairNested(f.contentDocument);const p=f.contentDocument.getElementById('panel');if(p&&!p.classList.contains('open')&&f.contentWindow.togglePanel)f.contentWindow.togglePanel()}catch(e){}},250)}if(name==='report'){const f=document.getElementById('reportFrame');setTimeout(()=>{try{repairNested(f.contentDocument);const p=f.contentDocument.getElementById('panel');if(p&&!p.classList.contains('open')&&f.contentWindow.togglePanel)f.contentWindow.togglePanel()}catch(e){}},250)}if(name==='gps'){const f=document.getElementById('gpsFrame');setTimeout(()=>{try{if(f.contentWindow.locateMe)f.contentWindow.locateMe()}catch(e){}},180)}}
['mapFrame','opsFrame','gpsFrame'].forEach(id=>document.getElementById(id).addEventListener('load',function(){hidePanels(this)}));setInterval(()=>{try{repairNested(document.getElementById('issueFrame').contentDocument);repairNested(document.getElementById('reportFrame').contentDocument)}catch(e){}},900);
let deferredPrompt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;document.getElementById('installBtn').style.display='block'});async function installApp(){if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;document.getElementById('installBtn').style.display='none'}window.addEventListener('appinstalled',()=>document.getElementById('installBtn').style.display='none');
function storageOK(){try{localStorage.setItem('__fbk_test','1');localStorage.removeItem('__fbk_test');return true}catch(e){return false}}
function systemStatus(){const sw=('serviceWorker'in navigator)?(navigator.serviceWorker.controller?'Aktif':'Disokong'):'Tidak disokong';alert('Status Sistem v7.3\nInternet: '+(navigator.onLine?'Online':'Offline')+'\nGPS: '+('geolocation'in navigator?'Disokong':'Tidak disokong')+'\nData tempatan: '+(storageOK()?'OK':'Masalah')+'\nPWA/Service Worker: '+sw)}
if('serviceWorker'in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js?v=73').catch(()=>{}))}
window.addEventListener('online',()=>document.getElementById('status').title='Dalam talian');window.addEventListener('offline',()=>document.getElementById('status').title='Luar talian — data tempatan masih tersedia');
</script></body></html>
