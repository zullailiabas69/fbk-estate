<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-store"><title>FBK PDF Render Test v6.7</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#d6dfd4;font-family:Arial,sans-serif}#stage{position:fixed;inset:0;overflow:hidden;touch-action:none;cursor:grab}#tiles{position:absolute;inset:0}.tile{position:absolute;width:256px;height:256px;user-select:none;-webkit-user-drag:none}#pdfCanvas{position:absolute;pointer-events:none;transform-origin:0 0}#overlay{position:absolute;inset:0;pointer-events:none}.panel{position:fixed;z-index:20;top:10px;left:10px;width:min(440px,calc(100% - 20px));background:#08100dee;color:white;border-radius:14px;padding:10px;box-shadow:0 6px 20px #0006}.panel b{font-size:15px}.small{font-size:11px;color:#d7e0db;line-height:1.4}.toolbar{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}button{border:0;border-radius:9px;padding:8px 10px;font-weight:700}.gold{background:#d6a03a;color:#172219}#zoom{position:fixed;z-index:21;left:12px;bottom:15px;display:flex;flex-direction:column;gap:5px}#zoom button{width:42px;height:42px;background:#fff;font-size:22px}.marker{position:absolute;transform:translate(-50%,-50%);width:22px;height:22px;border-radius:50%;border:3px solid white;box-shadow:0 2px 8px #0008}.label{position:absolute;transform:translate(-50%,14px);background:#fff;color:#172219;padding:3px 6px;border-radius:7px;font-size:10px;white-space:nowrap}.status{position:fixed;z-index:21;right:10px;bottom:10px;background:#08100dee;color:#fff;padding:7px 9px;border-radius:9px;font-size:10px}</style></head><body><div id="stage"><div id="tiles"></div><canvas id="pdfCanvas"></canvas><div id="overlay"></div></div><div class="panel"><b>FBK PDF Render Test v6.7</b><div class="small">Ujian baharu: PDF sebenar dirender semula pada setiap tahap zoom. Ini tidak mengubah production.</div><div class="toolbar"><button class="gold" onclick="focusSettlement()">Penempatan</button><button onclick="focusFull()">FELDA Penuh</button><button onclick="setMode('hybrid')">Hybrid</button><button onclick="setMode('pdf')">PDF sahaja</button><button onclick="setMode('osm')">OSM sahaja</button></div></div><div id="zoom"><button onclick="zoomBy(1)">＋</button><button onclick="zoomBy(-1)">−</button></div><div id="status" class="status">Memuat PDF…</div><script type="module">import * as pdfjsLib from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs';pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs';const B={left:102.574338999979,right:102.645916999087,top:3.380043596679,bottom:3.277425402};const P={home:{name:'Rumah',lat:3.33673797,lng:102.61342745,c:'#d6a03a'},masjid:{name:'Masjid',lat:3.33581846,lng:102.6110772,c:'#2d7d4d'},office:{name:'Pejabat FELDA',lat:3.33890128,lng:102.60955755,c:'#2277b7'},school:{name:'Sekolah',lat:3.33790094,lng:102.60956536,c:'#8e44ad'}};const TILE=256,stage=document.getElementById('stage'),tiles=document.getElementById('tiles'),canvas=document.getElementById('pdfCanvas'),ctx=canvas.getContext('2d'),ov=document.getElementById('overlay'),statusEl=document.getElementById('status');let center={lat:3.3374,lng:102.6108},zoom=16,mode='hybrid',page=null,renderTask=null,renderSeq=0;function lon2x(lon,z){return(lon+180)/360*TILE*2**z}function lat2y(lat,z){const r=lat*Math.PI/180,n=2**z;return(1-Math.asinh(Math.tan(r))/Math.PI)/2*TILE*n}function x2lon(x,z){return x/(TILE*2**z)*360-180}function y2lat(y,z){const n=Math.PI-2*Math.PI*y/(TILE*2**z);return 180/Math.PI*Math.atan(Math.sinh(n))}function xy(lat,lng){const cx=lon2x(center.lng,zoom),cy=lat2y(center.lat,zoom);return{x:lon2x(lng,zoom)-cx+innerWidth/2,y:lat2y(lat,zoom)-cy+innerHeight/2}}function drawTiles(){tiles.innerHTML='';if(mode==='pdf')return;const cx=lon2x(center.lng,zoom),cy=lat2y(center.lat,zoom),minX=Math.floor((cx-innerWidth/2)/TILE)-1,maxX=Math.floor((cx+innerWidth/2)/TILE)+1,minY=Math.floor((cy-innerHeight/2)/TILE)-1,maxY=Math.floor((cy+innerHeight/2)/TILE)+1,n=2**zoom;for(let tx=minX;tx<=maxX;tx++)for(let ty=minY;ty<=maxY;ty++){if(ty<0||ty>=n)continue;const im=document.createElement('img');im.className='tile';im.src=`https://tile.openstreetmap.org/${zoom}/${((tx%n)+n)%n}/${ty}.png`;im.style.left=(tx*TILE-cx+innerWidth/2)+'px';im.style.top=(ty*TILE-cy+innerHeight/2)+'px';tiles.appendChild(im)}}function drawOverlay(){ov.innerHTML='';for(const p of Object.values(P)){const q=xy(p.lat,p.lng);const m=document.createElement('div');m.className='marker';m.style.left=q.x+'px';m.style.top=q.y+'px';m.style.background=p.c;ov.appendChild(m);const l=document.createElement('div');l.className='label';l.style.left=q.x+'px';l.style.top=q.y+'px';l.textContent=p.name;ov.appendChild(l)}}async function drawPDF(){if(!page||mode==='osm'){canvas.style.display='none';return}canvas.style.display='block';const tl=xy(B.top,B.left),br=xy(B.bottom,B.right),cssW=Math.max(1,br.x-tl.x),cssH=Math.max(1,br.y-tl.y);canvas.style.left=tl.x+'px';canvas.style.top=tl.y+'px';canvas.style.width=cssW+'px';canvas.style.height=cssH+'px';canvas.style.opacity=mode==='hybrid'?'.82':'1';const seq=++renderSeq;const base=page.getViewport({scale:1});const dpr=Math.min(devicePixelRatio||1,2);let scale=Math.max(cssW/base.width,cssH/base.height)*dpr;scale=Math.min(scale,8);const vp=page.getViewport({scale});canvas.width=Math.max(1,Math.floor(vp.width));canvas.height=Math.max(1,Math.floor(vp.height));if(renderTask)try{renderTask.cancel()}catch(e){}ctx.clearRect(0,0,canvas.width,canvas.height);renderTask=page.render({canvasContext:ctx,viewport:vp});try{await renderTask.promise;if(seq===renderSeq)statusEl.textContent=`PDF asli · zoom ${zoom} · render ${canvas.width}×${canvas.height}`}catch(e){if(e?.name!=='RenderingCancelledException')statusEl.textContent='Render gagal: '+e.message}}function render(){drawTiles();drawOverlay();drawPDF()}window.focusSettlement=()=>{center={lat:3.3374,lng:102.6108};zoom=17;render()};window.focusFull=()=>{center={lat:(B.top+B.bottom)/2,lng:(B.left+B.right)/2};zoom=13;render()};window.setMode=m=>{mode=m;render()};window.zoomBy=d=>{zoom=Math.max(11,Math.min(19,zoom+d));render()};let drag=null;stage.addEventListener('pointerdown',e=>{if(e.target.closest('button')||e.target.closest('.panel'))return;drag={x:e.clientX,y:e.clientY,cx:lon2x(center.lng,zoom),cy:lat2y(center.lat,zoom)};stage.setPointerCapture(e.pointerId)});stage.addEventListener('pointermove',e=>{if(!drag)return;const wx=drag.cx-(e.clientX-drag.x),wy=drag.cy-(e.clientY-drag.y);center={lng:x2lon(wx,zoom),lat:y2lat(wy,zoom)};drawTiles();drawOverlay();drawPDF()});stage.addEventListener('pointerup',()=>drag=null);stage.addEventListener('pointercancel',()=>drag=null);stage.addEventListener('wheel',e=>{e.preventDefault();window.zoomBy(e.deltaY<0?1:-1)},{passive:false});window.addEventListener('resize',render);try{const doc=await pdfjsLib.getDocument({url:'v67/felda.pdf?v=67',disableAutoFetch:false,disableStream:false}).promise;page=await doc.getPage(1);statusEl.textContent='PDF sebenar dimuat';render()}catch(e){statusEl.textContent='PDF belum tersedia: '+e.message}</script></body></html>
