<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-store"><title>FBK Map v8.0 Lot Reader</title><style>*{box-sizing:border-box}html,body{height:100%;margin:0;background:#0b1812;color:#fff;font-family:Arial,sans-serif;overflow:hidden}#bar{position:fixed;z-index:50;left:8px;right:8px;top:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:#08100def;padding:7px;border-radius:12px;box-shadow:0 4px 16px #0007}button{border:0;border-radius:9px;padding:8px 10px;background:#1d3128;color:#fff;font-weight:800;font-size:11px;cursor:pointer}button.on{background:#d6a03a;color:#172219}#note{font-size:10px;color:#cbd5d0;margin-left:auto}.layer{position:fixed;inset:0;display:none}.layer.on{display:block}.layer iframe{width:100%;height:100%;border:0;background:#0b1812}#map{background:#e7e7e7;overflow:hidden;touch-action:none;cursor:grab}#map.drag{cursor:grabbing}#wrap{position:absolute;left:50%;top:50%;transform-origin:center center;will-change:transform}#base{display:block;width:3000px;height:auto;user-select:none;-webkit-user-drag:none;pointer-events:none}#labels{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}.lot{font-family:Arial,sans-serif;font-weight:900;fill:#101010;stroke:#fff;stroke-width:5;paint-order:stroke fill;stroke-linejoin:round}.alltxt{font-family:Arial,sans-serif;font-weight:700;fill:#111;stroke:#fff;stroke-width:4;paint-order:stroke fill}.badge{position:fixed;z-index:54;left:10px;bottom:12px;background:#08100de8;padding:7px 9px;border-radius:10px;font-size:10px}#zoom{position:fixed;z-index:55;right:10px;bottom:12px;display:none;gap:6px}#zoom button{font-size:18px;padding:7px 12px}.loader{position:absolute;inset:0;display:grid;place-items:center;color:#172219;font-weight:800;text-align:center;padding:30px}@media(max-width:760px){#bar{top:5px;left:5px;right:5px}button{font-size:9px;padding:7px 8px}#note{width:100%;margin-left:0}.badge{bottom:64px}#zoom{bottom:64px}}</style></head><body><div id="bar"><button id="bGps" class="on" onclick="mode('gps')">Peta GPS</button><button id="bOrig" onclick="mode('orig')">A0 Asal</button><button id="bLot" onclick="mode('lot')">Nombor Lot</button><button id="bAll" onclick="mode('all')">Semua Teks</button><span id="note">v8.0: nombor lot diambil terus daripada teks PDF A0 diperbaiki, bukan OCR.</span></div><div id="gps" class="layer on"><iframe src="v72.html?v=80-gps" title="Peta GPS"></iframe></div><div id="map" class="layer"><div id="loading" class="loader">Memuat peta…</div><div id="wrap"><img id="base" alt="Peta A0"><svg id="labels" viewBox="0 0 3370.4 2383.9" preserveAspectRatio="none"></svg></div></div><div id="zoom"><button onclick="zoomBy(1/1.35)">−</button><button onclick="fit()">⌂</button><button onclick="zoomBy(1.35)">+</button></div><div id="badge" class="badge">Peta GPS stabil</div><script>const gps=document.getElementById('gps'),map=document.getElementById('map'),wrap=document.getElementById('wrap'),base=document.getElementById('base'),svg=document.getElementById('labels'),loading=document.getElementById('loading'),zoom=document.getElementById('zoom'),badge=document.getElementById('badge');let scale=1,fitScale=1,x=0,y=0,drag=false,sx=0,sy=0,ox=0,oy=0,ready=false,textReady=false,current='orig';const buttons={gps:'bGps',orig:'bOrig',lot:'bLot',all:'bAll'};function active(k){Object.values(buttons).forEach(id=>document.getElementById(id).classList.remove('on'));document.getElementById(buttons[k]).classList.add('on')}async function getText(paths){const parts=await Promise.all(paths.map(p=>fetch(p+'?v=80',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(p+' '+r.status);return r.text()})));return parts.join('').replace(/\s+/g,'')}async function loadBase(){if(ready)return;const b64=await getText(['v783/a0_00','v783/a0_01','v783/a0_02','v783/a0_03']);base.src='data:image/webp;base64,'+b64;ready=true}async function ungzipJson(s){const bin=atob(s.replace(/\s+/g,'')),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);const ds=new DecompressionStream('gzip');return new Response(new Blob([u]).stream().pipeThrough(ds)).json()}function isLot(s){return /^\d{1,4}[A-Za-z]?(?:[-/]\d{1,4})?$/.test(s)}async function loadText(){if(textReady)return;const b64=await fetch('v80/a0_text.b64?v=80',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('text '+r.status);return r.text()});const d=await ungzipJson(b64),ns='http://www.w3.org/2000/svg',frag=document.createDocumentFragment();for(const w of d.t){const [x0,y0,x1,y1,txt]=w,e=document.createElementNS(ns,'text'),h=Math.max(7,y1-y0),lot=isLot(txt);e.setAttribute('x',((x0+x1)/2).toFixed(1));e.setAttribute('y',(y1-h*.08).toFixed(1));e.setAttribute('text-anchor','middle');e.setAttribute('font-size',(lot?Math.max(15,h*1.7):Math.max(10,h*1.15)).toFixed(1));e.setAttribute('class',lot?'lot':'alltxt');e.dataset.kind=lot?'lot':'all';e.textContent=txt;frag.appendChild(e)}svg.appendChild(frag);textReady=true}function showLabels(kind){current=kind;svg.style.display=kind==='orig'?'none':'block';svg.querySelectorAll('text').forEach(e=>{e.style.display=(kind==='all'||e.dataset.kind==='lot')?'':'none'});badge.textContent=kind==='lot'?'Lot Reader — nombor lot sahaja dibesarkan':kind==='all'?'Teks PDF diperjelas di atas peta asal':'A0 asal tanpa lapisan teks tambahan'}async function mode(k){gps.classList.remove('on');map.classList.remove('on');zoom.style.display='none';if(k==='gps'){gps.classList.add('on');active('gps');badge.textContent='Peta GPS stabil — routing & GPS kekal';return}active(k);map.classList.add('on');zoom.style.display='flex';loading.style.display='grid';loading.textContent='Memuat A0 dan teks PDF…';try{await Promise.all([loadBase(),loadText()]);showLabels(k);if(base.complete&&base.naturalWidth){loading.style.display='none';fit()}}catch(e){loading.textContent='Gagal dimuat: '+e.message}}function apply(){wrap.style.transform=`translate(calc(-50% + ${x}px),calc(-50% + ${y}px)) scale(${scale})`}function fit(){if(!base.naturalWidth)return;const pad=24,sw=(innerWidth-pad*2)/base.naturalWidth,sh=(innerHeight-pad*2)/base.naturalHeight;fitScale=Math.min(sw,sh);scale=fitScale;x=0;y=0;apply()}function zoomBy(f){scale=Math.max(fitScale*.55,Math.min(fitScale*24,scale*f));apply()}base.onload=()=>{loading.style.display='none';fit()};map.addEventListener('wheel',e=>{e.preventDefault();zoomBy(e.deltaY<0?1.18:1/1.18)},{passive:false});map.addEventListener('pointerdown',e=>{drag=true;map.classList.add('drag');map.setPointerCapture(e.pointerId);sx=e.clientX;sy=e.clientY;ox=x;oy=y});map.addEventListener('pointermove',e=>{if(!drag)return;x=ox+e.clientX-sx;y=oy+e.clientY-sy;apply()});map.addEventListener('pointerup',()=>{drag=false;map.classList.remove('drag')});map.addEventListener('pointercancel',()=>{drag=false;map.classList.remove('drag')});window.addEventListener('resize',()=>{if(map.classList.contains('on'))fit()});</script></body></html>
