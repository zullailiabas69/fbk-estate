<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-store"><title>FBK Multi-Layer Map v8.8</title><style>*{box-sizing:border-box}html,body{height:100%;margin:0;background:#f5f1df;font-family:Arial,sans-serif;overflow:hidden}.layer{position:absolute;inset:0;display:none}.layer.active{display:block}.layer iframe{width:100%;height:100%;border:0}.stage{position:absolute;inset:0;overflow:hidden;touch-action:none;overscroll-behavior:none;background:#f5f1df}.mapimg{position:absolute;left:50%;top:50%;max-width:none;transform-origin:center center;will-change:transform;user-select:none;-webkit-user-drag:none;pointer-events:none}.switch{position:fixed;z-index:500;left:50%;transform:translateX(-50%);top:88px;background:#08100ded;padding:5px;border-radius:12px;display:flex;gap:4px;box-shadow:0 4px 15px #0005;max-width:96vw;overflow:auto}.switch button{border:0;border-radius:9px;background:#24372f;color:#fff;padding:8px 10px;font-weight:800;font-size:9px;white-space:nowrap}.switch button.on{background:#d6a03a;color:#172219}.badge{position:fixed;z-index:510;left:10px;bottom:72px;background:#fffffff0;color:#111;border:1px solid #ddd;padding:7px 9px;border-radius:10px;font-size:9px;box-shadow:0 2px 10px #0002;display:none}.zoom{position:fixed;z-index:510;right:10px;bottom:72px;display:none;gap:6px}.zoom button{border:0;border-radius:10px;background:#202a25;color:#fff;font-weight:900;min-width:54px;min-height:54px;font-size:24px}.note{position:fixed;z-index:490;left:10px;right:10px;bottom:72px;text-align:center;pointer-events:none}.note span{display:inline-block;background:#08100ddd;color:#dce5df;padding:6px 9px;border-radius:9px;font-size:9px}</style></head><body><div id="clean" class="layer active"><iframe src="v88-clean-lot.html?v=8802" title="Peta Lot Bersih"></iframe></div><div id="a0" class="layer"><div id="stageA0" class="stage"><img id="imgA0" class="mapimg" alt="Peta A0 Diperbesar"></div></div><div id="ladang" class="layer"><div id="stageLad" class="stage"><img id="imgLad" class="mapimg" alt="Peta Ladang Diperjelas"></div></div><div class="switch"><button id="bclean" class="on" onclick="showLayer('clean')">Lot Bersih</button><button id="ba0" onclick="showLayer('a0')">A0 Diperbesar</button><button id="bladang" onclick="showLayer('ladang')">Ladang Diperjelas</button></div><div id="badge" class="badge"></div><div id="zoom" class="zoom"><button onclick="zoomBy(1/1.45)">−</button><button onclick="fitCurrent()">⌂</button><button onclick="zoomBy(1.45)">+</button></div><script>
const A0='assets/a0-tiny.jpg?v=8802';
const LAD='assets/ladang-tiny.jpg?v=8802';
const imgs={a0:document.getElementById('imgA0'),ladang:document.getElementById('imgLad')},stages={a0:document.getElementById('stageA0'),ladang:document.getElementById('stageLad')};let current='clean',scale=1,fitScale=1,x=0,y=0,W=1600,H=1132;const pts=new Map();let panStart=null,pinchStart=null;imgs.a0.src=A0;imgs.ladang.src=LAD;Object.entries(imgs).forEach(([k,im])=>im.onload=()=>{if(current===k)fitCurrent()});function activeBtn(n){['clean','a0','ladang'].forEach(v=>document.getElementById('b'+v).classList.toggle('on',v===n))}function showLayer(n){current=n;['clean','a0','ladang'].forEach(v=>document.getElementById(v).classList.toggle('active',v===n));activeBtn(n);const vis=n!=='clean';document.getElementById('badge').style.display=vis?'block':'none';document.getElementById('zoom').style.display=vis?'flex':'none';if(vis){badge.textContent=(n==='a0'?'A0 Diperbesar':'Ladang Diperjelas')+' · fail JPEG assets';setTimeout(fitCurrent,30)}parent.postMessage({type:'fbk-map-layer',layer:n},location.origin)}function img(){return imgs[current]}function apply(){if(current==='clean')return;img().style.transform=`translate(calc(-50% + ${x}px),calc(-50% + ${y}px)) scale(${scale})`}function fitCurrent(){if(current==='clean')return;const im=img();W=im.naturalWidth||1600;H=im.naturalHeight||1132;const top=145,pad=16;fitScale=Math.min((innerWidth-pad*2)/W,(innerHeight-top-pad-70)/H);scale=fitScale;x=0;y=top*.15;im.style.width=W+'px';im.style.height=H+'px';apply()}function setScale(s){scale=Math.max(fitScale*.65,Math.min(fitScale*30,s));apply();badge.textContent=(current==='a0'?'A0 Diperbesar':'Ladang Diperjelas')+' · Zoom '+Math.round(scale/fitScale*100)+'%'}function zoomBy(f){setScale(scale*f)}function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function mid(a,b){return{x:(a.x+b.x)/2,y:(a.y+b.y)/2}}['a0','ladang'].forEach(k=>{const stage=stages[k];stage.addEventListener('pointerdown',e=>{if(current!==k)return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});try{stage.setPointerCapture(e.pointerId)}catch(_){}if(pts.size===1)panStart={px:e.clientX,py:e.clientY,x,y};else if(pts.size===2){const a=[...pts.values()],m=mid(a[0],a[1]);pinchStart={d:Math.max(1,dist(a[0],a[1])),scale,x,y,mx:m.x,my:m.y};panStart=null}e.preventDefault()});stage.addEventListener('pointermove',e=>{if(current!==k||!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pts.size>=2&&pinchStart){const a=[...pts.values()].slice(0,2),m=mid(a[0],a[1]),ratio=dist(a[0],a[1])/pinchStart.d;scale=Math.max(fitScale*.65,Math.min(fitScale*30,pinchStart.scale*ratio));x=pinchStart.x+(m.x-pinchStart.mx);y=pinchStart.y+(m.y-pinchStart.my);apply();return}if(pts.size===1&&panStart){x=panStart.x+e.clientX-panStart.px;y=panStart.y+e.clientY-panStart.py;apply()}});function end(e){pts.delete(e.pointerId);if(pts.size<2)pinchStart=null;if(pts.size===1){const p=[...pts.values()][0];panStart={px:p.x,py:p.y,x,y}}else panStart=null;e.preventDefault()}stage.addEventListener('pointerup',end);stage.addEventListener('pointercancel',end)});window.addEventListener('resize',fitCurrent);</script></body></html>
