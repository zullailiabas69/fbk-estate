<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FBK Hybrid HD v6.0</title><style>html,body,#base{width:100%;height:100%;margin:0;border:0;background:#0b1812;overflow:hidden}#badge{position:fixed;z-index:999;right:8px;bottom:8px;background:#08100dea;color:#fff;font:10px Arial;padding:5px 8px;border-radius:8px;pointer-events:none}</style></head><body><iframe id="base" src="base.html?v=60-core"></iframe><div id="badge">Memuat HD…</div><script>const f=document.getElementById('base'),badge=document.getElementById('badge');async function applyHD(){try{const names=['c00','c01','c02a','c02b','c03','c04','c05','c06','c07','c08','c09','c10','c11'];const parts=await Promise.all(names.map(n=>fetch('map60/'+n+'?v=60',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(n);return r.text()})));const b64=parts.join('').replace(/\s+/g,'');const d=f.contentDocument,w=f.contentWindow,img=d.getElementById('estateImg');if(!img)throw Error('estateImg');img.onload=()=>{badge.textContent='GeoPDF HD 1200×1720';const st=d.getElementById('status'),inf=d.getElementById('info');if(st)st.textContent='Hybrid HD Map v6.0 aktif.';if(inf)inf.textContent='Overlay FELDA HD 1200×1720 + OSM. Alignment v5.9 dikekalkan.';if(w.renderMap)w.renderMap()};img.onerror=()=>{badge.textContent='HD gagal — v5.9 kekal'};img.src='data:image/webp;base64,'+b64}catch(e){badge.textContent='HD gagal — v5.9 kekal'}}f.addEventListener('load',()=>setTimeout(applyHD,80));function openOps(){try{f.contentWindow.openOps()}catch(e){}}function closeOps(){try{f.contentWindow.closeOps()}catch(e){}}function locateMe(){try{f.contentWindow.locateMe()}catch(e){}}function routeTo(k){try{f.contentWindow.routeTo(k)}catch(e){}}function setMapMode(m){try{f.contentWindow.setMapMode(m)}catch(e){}}function setFocus(m){try{f.contentWindow.setFocus(m)}catch(e){}}</script></body></html>
