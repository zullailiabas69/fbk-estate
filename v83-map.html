<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-store"><title>FBK Peta→Operasi v8.3</title><style>*{box-sizing:border-box}html,body{height:100%;margin:0;background:#0b1812;font-family:Arial,sans-serif;overflow:hidden}iframe{width:100%;height:100%;border:0;background:#f7f6f1}#pick{position:fixed;z-index:500;left:50%;bottom:14px;transform:translateX(-50%);display:none;gap:8px;align-items:center;background:#08100df2;color:#fff;padding:8px 10px;border-radius:12px;box-shadow:0 4px 16px #0007}#pick b{font-size:12px;white-space:nowrap}button{border:0;border-radius:9px;padding:9px 12px;font-weight:800;cursor:pointer;background:#d6a03a;color:#172219;font-size:11px}#hint{position:fixed;z-index:499;left:50%;bottom:14px;transform:translateX(-50%);background:#08100de8;color:#d8e2dd;padding:7px 10px;border-radius:10px;font-size:10px;pointer-events:none}@media(max-width:650px){#pick{bottom:10px;max-width:94%;flex-wrap:wrap;justify-content:center}#hint{bottom:10px;font-size:9px;max-width:90%;text-align:center}}</style></head><body><iframe id="map" src="v82-clean-lot.html?v=83" title="Peta Lot Bersih"></iframe><div id="hint">Tekan nombor lot untuk pilih, kemudian Rekod Kerja.</div><div id="pick"><b id="picked">Lot</b><button onclick="recordWork()">Rekod Kerja</button><button onclick="clearPick()" style="background:#294238;color:#fff">Batal</button></div><script>const f=document.getElementById('map'),pick=document.getElementById('pick'),hint=document.getElementById('hint'),picked=document.getElementById('picked');let selected='';function bind(){try{const d=f.contentDocument;if(!d)return;d.querySelectorAll('.lotnum').forEach(t=>{t.style.cursor='pointer';t.addEventListener('click',e=>{e.stopPropagation();d.querySelectorAll('.lotnum').forEach(x=>x.style.fill='#101010');t.style.fill='#0057b8';selected=t.textContent.trim();picked.textContent='Lot '+selected;pick.style.display='flex';hint.style.display='none'})})}catch(e){}}f.addEventListener('load',()=>setTimeout(bind,350));function clearPick(){selected='';pick.style.display='none';hint.style.display='block';try{f.contentDocument.querySelectorAll('.lotnum').forEach(x=>x.style.fill='#101010')}catch(e){}}function recordWork(){if(!selected)return;parent.postMessage({type:'fbk-record-lot',lot:selected},location.origin)}</script></body></html>
