<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-store"><meta name="theme-color" content="#0b1812"><title>FELDA Bukit Kepayang Digital Estate System v7.8.3</title><style>*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:Arial,sans-serif;background:#0b1812;color:#fff}body{overflow:hidden}.view{position:absolute;inset:0 0 64px;display:none}.view.active{display:block}.view iframe{width:100%;height:100%;border:0}.topbar{position:fixed;z-index:200;left:12px;top:12px;background:#08100def;padding:8px 11px;border-radius:12px;pointer-events:none;box-shadow:0 4px 16px #0006}.topbar b{display:block;font-size:13px}.topbar span{font-size:10px;color:#cbd5d0}.status{position:fixed;z-index:250;right:12px;top:12px;background:#08100de8;padding:7px 9px;border-radius:10px;font-size:10px}.nav{position:fixed;z-index:300;left:10px;right:10px;bottom:8px;height:50px;background:#08100df7;border-radius:15px;padding:5px;display:grid;grid-template-columns:repeat(6,1fr);gap:5px}.nav button{border:0;border-radius:10px;background:#1a2b24;color:#e8eeeb;font-weight:800;font-size:10px}.nav button.active{background:#d6a03a;color:#172219}@media(max-width:760px){.nav{left:8px;right:8px;bottom:7px;height:54px}.nav button{font-size:8px}.view{inset:0 0 68px}.topbar{left:8px;top:8px;max-width:65%}.status{right:8px;top:8px}}</style></head><body><div class="topbar"><b>FELDA Bukit Kepayang Digital Estate System</b><span>Original HD Map Viewer Test v7.8.3</span></div><div id="status" class="status">Peta</div><div id="mapView" class="view active"><iframe id="mapFrame" src="v783-map.html?v=783"></iframe></div><div id="dashView" class="view"><iframe id="dashFrame" src="v77-dashboard.html?v=783"></iframe></div><div id="opsView" class="view"><iframe id="opsFrame" src="v72.html?v=783-ops"></iframe></div><div id="issueView" class="view"><iframe id="issueFrame" src="v55.html?v=783"></iframe></div><div id="reportView" class="view"><iframe id="reportFrame" src="v56.html?v=783"></iframe></div><div id="gpsView" class="view"><iframe id="gpsFrame" src="v72.html?v=783-gps"></iframe></div><div class="nav"><button id="nMap" class="active" onclick="showView('map')">🗺️<br>Peta</button><button id="nDash" onclick="showView('dash')">📋<br>Dashboard</button><button id="nOps" onclick="showView('ops')">🧾<br>Operasi</button><button id="nIssue" onclick="showView('issue')">⚠️<br>Isu</button><button id="nReport" onclick="showView('report')">📊<br>Laporan</button><button id="nGps" onclick="showView('gps')">📍<br>GPS</button></div><script>const views={map:'mapView',dash:'dashView',ops:'opsView',issue:'issueView',report:'reportView',gps:'gpsView'},navs={map:'nMap',dash:'nDash',ops:'nOps',issue:'nIssue',report:'nReport',gps:'nGps'},labels={map:'Peta HD v7.8.3',dash:'Dashboard',ops:'Operasi',issue:'Isu',report:'Laporan',gps:'GPS'};function showView(n){Object.values(views).forEach(id=>document.getElementById(id).classList.remove('active'));Object.values(navs).forEach(id=>document.getElementById(id).classList.remove('active'));document.getElementById(views[n]).classList.add('active');document.getElementById(navs[n]).classList.add('active');document.getElementById('status').textContent=labels[n];if(n==='dash')setTimeout(()=>{try{const f=document.getElementById('dashFrame');if(f.contentWindow.render)f.contentWindow.render()}catch(e){}},80);if(n==='ops')setTimeout(()=>{try{const f=document.getElementById('opsFrame');if(f.contentWindow.openOps)f.contentWindow.openOps()}catch(e){}},120);if(n==='gps')setTimeout(()=>{try{const f=document.getElementById('gpsFrame');if(f.contentWindow.locateMe)f.contentWindow.locateMe()}catch(e){}},180)}</script></body></html>
