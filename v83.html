<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-store"><meta name="theme-color" content="#0b1812"><title>FELDA Bukit Kepayang Digital Estate System v8.3</title><style>*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:Arial,sans-serif;background:#0b1812;color:#fff}body{overflow:hidden}.view{position:absolute;inset:0 0 66px;display:none}.view.active{display:block}.view iframe{width:100%;height:100%;border:0;background:#0b1812}.topbar{position:fixed;z-index:200;left:10px;top:10px;background:#08100def;padding:8px 11px;border-radius:12px;pointer-events:none;box-shadow:0 4px 16px #0006}.topbar b{display:block;font-size:13px}.topbar span{font-size:10px;color:#cbd5d0}.status{position:fixed;z-index:250;right:10px;top:10px;background:#08100de8;padding:7px 9px;border-radius:10px;font-size:10px}.nav{position:fixed;z-index:300;left:10px;right:10px;bottom:8px;height:52px;background:#08100df7;border-radius:15px;padding:5px;display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.nav button{border:0;border-radius:10px;background:#1a2b24;color:#e8eeeb;font-weight:800;font-size:10px}.nav button.active{background:#d6a03a;color:#172219}@media(max-width:760px){.nav{left:8px;right:8px;bottom:7px;height:56px}.nav button{font-size:9px}.view{inset:0 0 70px}.topbar{left:8px;top:8px;max-width:68%}.status{right:8px;top:8px}}</style></head><body><div class="topbar"><b>FELDA Bukit Kepayang Digital Estate System</b><span>Peta Lot Bersih → Operasi Ringkas · v8.3 TEST</span></div><div id="status" class="status">Peta</div><div id="mapView" class="view active"><iframe id="mapFrame" src="v83-map.html?v=83" title="Peta Lot Bersih"></iframe></div><div id="opsView" class="view"><iframe id="opsFrame" src="v79-ops.html?v=83" title="Operasi Ringkas"></iframe></div><div id="reportView" class="view"><iframe id="reportFrame" src="v79-report.html?v=83" title="Laporan Ringkas"></iframe></div><div id="gpsView" class="view"><iframe id="gpsFrame" src="v72.html?v=83-gps" title="GPS"></iframe></div><div class="nav"><button id="nMap" class="active" onclick="showView('map')">🗺️<br>Peta</button><button id="nOps" onclick="showView('ops')">🧾<br>Operasi</button><button id="nReport" onclick="showView('report')">📊<br>Laporan</button><button id="nGps" onclick="showView('gps')">📍<br>GPS</button></div><script>const views={map:'mapView',ops:'opsView',report:'reportView',gps:'gpsView'},navs={map:'nMap',ops:'nOps',report:'nReport',gps:'nGps'},labels={map:'Peta Lot Bersih',ops:'Operasi Ringkas',report:'Laporan Ringkas',gps:'GPS'};function showView(n){Object.values(views).forEach(id=>document.getElementById(id).classList.remove('active'));Object.values(navs).forEach(id=>document.getElementById(id).classList.remove('active'));document.getElementById(views[n]).classList.add('active');document.getElementById(navs[n]).classList.add('active');document.getElementById('status').textContent=labels[n];if(n==='report')setTimeout(()=>{try{const w=document.getElementById('reportFrame').contentWindow;if(w.render)w.render()}catch(e){}},80);if(n==='gps')setTimeout(()=>{try{const w=document.getElementById('gpsFrame').contentWindow;if(w.locateMe)w.locateMe()}catch(e){}},180)}window.addEventListener('message',e=>{if(e.origin!==location.origin||!e.data||e.data.type!=='fbk-record-lot')return;const lot=String(e.data.lot||'').trim();if(!lot)return;showView('ops');setTimeout(()=>{try{const d=document.getElementById('opsFrame').contentDocument;const input=d&&d.getElementById('lot');if(input){input.value='Lot '+lot;input.focus();input.scrollIntoView({behavior:'smooth',block:'center'})}}catch(err){}},120)});</script></body></html>
