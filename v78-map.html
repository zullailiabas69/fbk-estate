<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-store"><title>FBK Multi-Layer Map v7.8</title><style>*{box-sizing:border-box}html,body{height:100%;margin:0;background:#0b1812;color:#fff;font-family:Arial,sans-serif;overflow:hidden}#bar{position:fixed;z-index:50;left:8px;right:8px;top:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:#08100def;padding:7px;border-radius:12px;box-shadow:0 4px 16px #0007}button{border:0;border-radius:9px;padding:8px 10px;background:#1d3128;color:#fff;font-weight:800;font-size:11px;cursor:pointer}button.on{background:#d6a03a;color:#172219}#note{font-size:10px;color:#cbd5d0;margin-left:auto}#gps,#ref,#compare{position:fixed;inset:0}#gps{display:block}iframe{width:100%;height:100%;border:0;background:#0b1812}#ref{display:none;background:#e9e6cd;overflow:hidden;touch-action:none}#canvas{position:absolute;left:50%;top:50%;transform-origin:center center;will-change:transform;user-select:none;pointer-events:none;max-width:none}#zoom{position:fixed;z-index:55;right:10px;bottom:12px;display:none;gap:6px}#zoom button{font-size:18px;padding:7px 12px}.badge{position:fixed;z-index:54;left:10px;bottom:12px;background:#08100de8;padding:7px 9px;border-radius:10px;font-size:10px;display:none}#compare{display:none;grid-template-columns:1fr 1fr;padding-top:0}.pane{position:relative;overflow:hidden;border-right:1px solid #fff2;background:#111}.pane:last-child{border:0}.pane iframe{position:absolute;inset:0}.pane .fit{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#eee} @media(max-width:760px){#bar{top:5px;left:5px;right:5px}button{font-size:9px;padding:7px 8px}#note{width:100%;margin-left:0}.badge{bottom:64px}#zoom{bottom:64px}#compare{grid-template-columns:1fr;grid-template-rows:1fr 1fr}}</style></head><body><div id="bar"><button id="bGps" class="on" onclick="mode('gps')">Peta GPS</button><button id="bA0" onclick="mode('a0')">A0 Jelas</button><button id="bLad" onclick="mode('ladang')">Ladang Jelas</button><button id="bCmp" onclick="mode('compare')">Banding</button><span id="note">GPS/routing kekal pada Peta GPS. Peta rujukan belum dianggap koordinat rasmi.</span></div><div id="gps"><iframe src="v72.html?v=78-core" title="Peta GPS"></iframe></div><div id="ref"><img id="canvas" alt="Peta rujukan"></div><div id="compare"><div class="pane"><iframe src="v72.html?v=78-compare" title="Peta GPS"></iframe></div><div class="pane"><img id="cmpImg" class="fit" alt="Peta rujukan"></div></div><div id="zoom"><button onclick="z(-.2)">−</button><button onclick="resetView()">⌂</button><button onclick="z(.2)">+</button></div><div id="badge" class="badge"></div><script>const gps=document.getElementById('gps'),ref=document.getElementById('ref'),compare=document.getElementById('compare'),img=document.getElementById('canvas'),cmp=document.getElementById('cmpImg'),zoom=document.getElementById('zoom'),badge=document.getElementById('badge');let assets={},kind='a0',scale=1,x=0,y=0,drag=false,sx=0,sy=0,ox=0,oy=0;async function loadAsset(k){if(assets[k])return assets[k];const p=k==='a0'?'v78/a0.b64':'v78/ladang.b64';const t=await fetch(p+'?v=78',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.text()});return assets[k]='data:image/jpeg;base64,'+t.trim()}function active(id){['bGps','bA0','bLad','bCmp'].forEach(i=>document.getElementById(i).classList.remove('on'));document.getElementById(id).classList.add('on')}async function mode(m){gps.style.display='none';ref.style.display='none';compare.style.display='none';zoom.style.display='none';badge.style.display='none';if(m==='gps'){gps.style.display='block';active('bGps');return}if(m==='compare'){kind=kind||'a0';cmp.src=await loadAsset(kind);compare.style.display='grid';active('bCmp');badge.textContent='Banding: Peta GPS | '+(kind==='a0'?'A0 Jelas':'Ladang Jelas');badge.style.display='block';return}kind=m;img.src=await loadAsset(kind);ref.style.display='block';zoom.style.display='flex';badge.textContent=(kind==='a0'?'A0 Jelas — nombor lot & sempadan':'Ladang Jelas — nama & susunan ladang');badge.style.display='block';active(kind==='a0'?'bA0':'bLad');resetView()}function apply(){img.style.transform=`translate(calc(-50% + ${x}px),calc(-50% + ${y}px)) scale(${scale})`}function resetView(){scale=1;x=0;y=0;apply()}function z(d){scale=Math.max(.35,Math.min(6,scale+d));apply()}ref.addEventListener('wheel',e=>{e.preventDefault();z(e.deltaY<0?.15:-.15)},{passive:false});ref.addEventListener('pointerdown',e=>{drag=true;ref.setPointerCapture(e.pointerId);sx=e.clientX;sy=e.clientY;ox=x;oy=y});ref.addEventListener('pointermove',e=>{if(!drag)return;x=ox+e.clientX-sx;y=oy+e.clientY-sy;apply()});ref.addEventListener('pointerup',()=>drag=false);ref.addEventListener('pointercancel',()=>drag=false);img.onload=resetView;</script></body></html>
