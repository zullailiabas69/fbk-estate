<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1812">
<title>FELDA Bukit Kepayang — Map Recovery v4.4</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body,#map{height:100%;margin:0}body{font-family:Arial,sans-serif;background:#e9efe9}#map{position:absolute;inset:0}.panel{position:fixed;z-index:1000;top:10px;left:10px;right:10px;max-width:520px;background:rgba(8,15,12,.94);color:#fff;padding:12px;border-radius:14px;box-shadow:0 8px 24px #0005}.panel h1{font-size:16px;margin:0 0 6px}.panel p{font-size:11px;line-height:1.4;margin:4px 0;color:#d7e1dd}.toolbar{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}button{border:0;border-radius:8px;padding:8px 9px;font-weight:700;cursor:pointer}.gold{background:#d6a03a}.blue{background:#2277b7;color:#fff}.alt{background:#294238;color:#fff}.status{position:fixed;z-index:1000;left:10px;bottom:10px;background:#08100de8;color:#fff;padding:8px 10px;border-radius:999px;font-size:11px}.leaflet-control-attribution{font-size:9px}@media(max-width:700px){.panel{max-height:43%;overflow:auto}.toolbar button{font-size:10px;padding:8px}.status{right:10px;border-radius:10px;text-align:center}}
</style>
</head>
<body>
<div id="map"></div>
<section class="panel">
<h1>FELDA Bukit Kepayang — Map Recovery v4.4</h1>
<p>Versi pemulihan peta. Maya guna Leaflet + OpenStreetMap untuk pastikan peta hidup semula sebelum modul penuh dimasukkan semula.</p>
<div class="toolbar">
<button id="homeBtn" class="gold">Rumah</button>
<button id="masjidBtn">Masjid</button>
<button id="officeBtn">Pejabat</button>
<button id="schoolBtn">Sekolah</button>
<button id="kksBtn">KKS</button>
<button id="routeMasjid" class="gold">Rumah → Masjid</button>
<button id="gpsBtn" class="blue">Lokasi Saya</button>
<button id="clearRoute" class="alt">Buang Laluan</button>
</div>
<p id="routeInfo">Belum ada laluan.</p>
</section>
<div class="status" id="status">Memuatkan peta…</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const P={
 home:{name:'Rumah',lat:3.33673797,lng:102.61342745},
 masjid:{name:'Masjid FELDA Bukit Kepayang',lat:3.33581846,lng:102.6110772},
 office:{name:'Pejabat FELDA Bukit Kepayang',lat:3.33890128,lng:102.60955755},
 school:{name:'Sekolah',lat:3.33790094,lng:102.60956536},
 kks:{name:'KKS (provisional)',lat:3.346333,lng:102.596861}
};
let map,routeLayer=null,userMarker=null;
try{
 map=L.map('map',{zoomControl:true}).setView([3.3373,102.6105],15);
 L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
 const colors={home:'#d6a03a',masjid:'#2d7d4d',office:'#2277b7',school:'#8e44ad',kks:'#d35400'};
 Object.entries(P).forEach(([k,p])=>L.circleMarker([p.lat,p.lng],{radius:8,color:'#fff',weight:2,fillColor:colors[k],fillOpacity:1}).addTo(map).bindPopup('<b>'+p.name+'</b><br>'+p.lat.toFixed(6)+', '+p.lng.toFixed(6)));
 status.textContent='Peta berjaya dimuatkan.';
}catch(e){status.textContent='Ralat peta: '+e.message;}
function go(key){const p=P[key];map.setView([p.lat,p.lng],17);}
homeBtn.onclick=()=>go('home');masjidBtn.onclick=()=>go('masjid');officeBtn.onclick=()=>go('office');schoolBtn.onclick=()=>go('school');kksBtn.onclick=()=>go('kks');
routeMasjid.onclick=async()=>{
 const a=P.home,b=P.masjid;status.textContent='Mencari laluan…';
 try{
  const u=`https://router.project-osrm.org/route/v1/driving/${a.lng},${a.lat};${b.lng},${b.lat}?overview=full&geometries=geojson`;
  const j=await fetch(u).then(r=>r.json());if(!j.routes||!j.routes[0])throw new Error('Laluan tidak ditemui');
  const coords=j.routes[0].geometry.coordinates.map(c=>[c[1],c[0]]);
  if(routeLayer)map.removeLayer(routeLayer);routeLayer=L.polyline(coords,{weight:6}).addTo(map);map.fitBounds(routeLayer.getBounds(),{padding:[30,30]});
  routeInfo.textContent=`Rumah → Masjid · ${(j.routes[0].distance/1000).toFixed(2)} km · ${Math.round(j.routes[0].duration/60)} min`;
  status.textContent='Laluan siap.';
 }catch(e){status.textContent='Routing gagal: '+e.message;}
};
clearRoute.onclick=()=>{if(routeLayer){map.removeLayer(routeLayer);routeLayer=null}routeInfo.textContent='Belum ada laluan.'};
gpsBtn.onclick=()=>{
 if(!navigator.geolocation){status.textContent='GPS tidak disokong.';return}
 status.textContent='Mencari lokasi…';
 navigator.geolocation.getCurrentPosition(pos=>{
  const ll=[pos.coords.latitude,pos.coords.longitude];if(userMarker)map.removeLayer(userMarker);userMarker=L.marker(ll).addTo(map).bindPopup('Lokasi Saya').openPopup();map.setView(ll,17);status.textContent='Lokasi dijumpai.';
 },err=>status.textContent='GPS gagal: '+err.message,{enableHighAccuracy:true,timeout:15000});
};
</script>
</body>
</html>
