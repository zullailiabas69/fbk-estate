<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>FELDA Bukit Kepayang — Emergency Map v4.5</title>
<style>
html,body{height:100%;margin:0;font-family:Arial,sans-serif;background:#fff}#wrap{position:fixed;inset:0;background:#fff}#mapframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#f4f4f4}.panel{position:fixed;z-index:10;top:10px;left:10px;right:10px;max-width:520px;background:rgba(8,15,12,.94);color:#fff;padding:12px;border-radius:14px;box-shadow:0 8px 24px #0005}.panel h1{font-size:16px;margin:0 0 5px}.panel p{font-size:11px;line-height:1.4;margin:4px 0;color:#d7e1dd}.toolbar{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}button,a.btn{border:0;border-radius:8px;padding:8px 9px;font-weight:700;cursor:pointer;text-decoration:none;background:#eef3f0;color:#16201c;font-size:12px}.gold{background:#d6a03a!important}.blue{background:#2277b7!important;color:#fff!important}.status{position:fixed;z-index:10;left:10px;bottom:10px;background:#08100de8;color:white;padding:8px 10px;border-radius:10px;font-size:11px}@media(max-width:700px){.panel{max-height:42%;overflow:auto}.toolbar button,.toolbar a{font-size:10px;padding:8px}}
</style>
</head>
<body>
<div id="wrap">
<iframe id="mapframe" title="Peta FELDA Bukit Kepayang" src="https://www.openstreetmap.org/export/embed.html?bbox=102.595%2C3.326%2C102.626%2C3.350&layer=mapnik&marker=3.33673797%2C102.61342745"></iframe>
</div>
<section class="panel">
<h1>FELDA Bukit Kepayang — Emergency Map v4.5</h1>
<p>Versi ini sengaja tidak menggunakan MapLibre atau Leaflet. Peta dimuat terus melalui OpenStreetMap untuk mengasingkan masalah cache/browser.</p>
<div class="toolbar">
<a class="btn gold" href="https://www.openstreetmap.org/?mlat=3.33673797&mlon=102.61342745#map=17/3.33673797/102.61342745" target="_blank">Buka Rumah di OSM</a>
<a class="btn" href="https://www.openstreetmap.org/?mlat=3.33581846&mlon=102.6110772#map=17/3.33581846/102.6110772" target="_blank">Masjid</a>
<a class="btn" href="https://www.openstreetmap.org/?mlat=3.33890128&mlon=102.60955755#map=17/3.33890128/102.60955755" target="_blank">Pejabat</a>
<button id="clearCache" class="blue">Buang Cache Lama</button>
</div>
</section>
<div class="status" id="status">Emergency map v4.5 aktif.</div>
<script>
(async()=>{
 try{
  if('serviceWorker' in navigator){
   const regs=await navigator.serviceWorker.getRegistrations();
   for(const r of regs) await r.unregister();
  }
  if('caches' in window){
   const names=await caches.keys();
   for(const n of names) await caches.delete(n);
  }
  status.textContent='v4.5 aktif · cache lama dibersihkan.';
 }catch(e){status.textContent='v4.5 aktif · pembersihan cache tidak lengkap.'}
})();
clearCache.onclick=async()=>{
 try{
  if('serviceWorker' in navigator){const regs=await navigator.serviceWorker.getRegistrations();for(const r of regs)await r.unregister()}
  if('caches' in window){const names=await caches.keys();for(const n of names)await caches.delete(n)}
  localStorage.setItem('fbk_cache_reset',new Date().toISOString());
  location.replace(location.pathname+'?v=45&t='+Date.now());
 }catch(e){location.reload(true)}
};
</script>
</body>
</html>
