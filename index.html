<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0"><meta name="theme-color" content="#0b1812"><title>FELDA Bukit Kepayang — GeoPDF + Routing v5.3</title><style>
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:Arial,sans-serif;background:#e7e8cf;color:#122018}body{overflow:hidden}#stage{position:fixed;inset:0;overflow:hidden;background:#e7e8cf}#estateImg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 42%;filter:contrast(1.15) saturate(1.05);user-select:none;-webkit-user-drag:none}#routeSvg,#overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.marker{position:absolute;transform:translate(-50%,-50%);width:24px;height:24px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 8px #0008}.label{position:absolute;transform:translate(-50%,14px);background:#fff;color:#172219;padding:3px 6px;border-radius:7px;font-size:10px;white-space:nowrap;box-shadow:0 2px 8px #0003}.panel{position:fixed;z-index:20;top:10px;left:10px;width:min(480px,calc(100% - 20px));max-height:52vh;overflow:auto;background:rgba(8,15,12,.95);color:#fff;border-radius:14px;padding:12px;box-shadow:0 8px 24px #0005}.panel h1{font-size:17px;margin:0 0 5px}.small{font-size:11px;line-height:1.4;color:#d8e1dc}.toolbar{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}button{border:0;border-radius:9px;padding:8px 9px;font-weight:700;cursor:pointer;background:#eef3f0;color:#16201c}.gold{background:#d6a03a}.blue{background:#2277b7;color:#fff}.green{background:#2d7d4d;color:#fff}.red{background:#7a2d2d;color:#fff}.alt{background:#294238;color:#fff}.right{position:fixed;z-index:21;top:10px;right:10px;width:min(370px,calc(100% - 20px));max-height:calc(100% - 20px);overflow:auto;background:rgba(8,15,12,.96);color:#fff;border-radius:14px;padding:12px;box-shadow:0 8px 24px #0005}.right h2{font-size:15px;margin:10px 0 6px}.card,.record{background:#15251f;border-radius:10px;padding:9px;margin-bottom:7px}.dashboard{display:grid;grid-template-columns:1fr 1fr;gap:7px}.dashboard strong{display:block;font-size:20px}.right input,.right select,.right textarea{width:100%;margin:4px 0 8px;padding:8px;border-radius:8px;border:1px solid #385247;background:#102019;color:#fff}.right textarea{min-height:58px}.status{position:fixed;z-index:30;left:50%;bottom:12px;transform:translateX(-50%);background:#08100dea;color:#fff;padding:8px 12px;border-radius:999px;font-size:11px}.mobilebar{display:none}@media(max-width:950px){.right{display:none;left:8px;right:8px;top:64px;width:auto;max-height:calc(100% - 140px)}.panel{left:8px;right:8px;top:8px;width:auto;max-height:48vh}.mobilebar{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;position:fixed;z-index:40;left:8px;right:8px;bottom:8px;background:#08100df2;padding:6px;border-radius:14px}.mobilebar button{font-size:10px;min-height:42px;padding:7px 4px}.status{bottom:66px;left:8px;right:8px;transform:none;text-align:center;border-radius:10px}}
</style></head><body><div id="stage"><img id="estateImg" alt="Peta FELDA Bukit Kepayang"><svg id="routeSvg"></svg><div id="overlay"></div></div>
<section class="panel"><h1>FELDA Bukit Kepayang — GeoPDF + Routing v5.3</h1><div class="small">Asas peta v5.2 dikekalkan. Routing OSRM dan GPS ditambah di atas pelan FELDA.</div><div class="toolbar"><button class="gold" onclick="setFocus('settlement')">Penempatan</button><button onclick="setFocus('full')">Peta Penuh</button><button onclick="setFocus('estate')">Ladang</button><button class="blue" onclick="locateMe()">GPS</button></div><div class="toolbar"><button class="gold" onclick="routeTo('masjid')">Rumah → Masjid</button><button onclick="routeTo('office')">Rumah → Pejabat</button><button onclick="routeTo('school')">Rumah → Sekolah</button><button onclick="routeTo('kks')">Rumah → KKS</button><button class="alt" onclick="clearRoute()">Buang Laluan</button></div><div id="routeInfo" class="small">Belum ada laluan.</div><div id="info" class="small">Memuatkan imej GeoPDF sebenar…</div></section>
<section class="right" id="opsPanel"><h2>Dashboard Operasi Ladang</h2><div class="dashboard"><div class="card"><strong id="cAll">0</strong><span class="small">Jumlah</span></div><div class="card"><strong id="cDone">0</strong><span class="small">Siap</span></div><div class="card"><strong id="cProg">0</strong><span class="small">Berjalan</span></div><div class="card"><strong id="cTodo">0</strong><span class="small">Belum mula</span></div></div><h2>Tambah Rekod Kerja</h2><div class="card"><label class="small">Blok/Lot</label><input id="lot" placeholder="Contoh: Blok 3 / Lot 12"><label class="small">Jenis kerja</label><select id="type"><option>Penuaian</option><option>Pembajaan</option><option>Racun rumpai</option><option>Pruning</option><option>Jalan ladang</option><option>Parit/saliran</option><option>Lain-lain</option></select><label class="small">Status</label><select id="st"><option>Belum mula</option><option>Sedang berjalan</option><option>Siap</option></select><label class="small">Tarikh sasaran</label><input id="target" type="date"><label class="small">Pekerja/Kontraktor</label><input id="assignee" placeholder="Nama"><label class="small">Catatan</label><textarea id="note" placeholder="Catatan kerja"></textarea><button class="green" style="width:100%" onclick="addRecord()">Simpan Rekod</button></div><h2>Rekod Terkini</h2><div id="records"></div><div class="toolbar"><button onclick="exportData()">Eksport JSON</button><button class="red" onclick="clearAll()">Padam Semua Rekod</button></div></section>
<div class="status" id="status">GeoPDF v5.3 sedang dimuat…</div><div class="mobilebar"><button onclick="closeOps()">Peta</button><button onclick="openOps()">Operasi</button><button onclick="locateMe()">GPS</button><button onclick="openOps();document.getElementById('lot').focus()">+ Rekod</button></div>
<script>
const B={left:102.574338999979,right:102.645916999087,top:3.380043596679,bottom:3.277425402};const P={home:{name:'Rumah',lat:3.33673797,lng:102.61342745,c:'#d6a03a'},masjid:{name:'Masjid',lat:3.33581846,lng:102.6110772,c:'#2d7d4d'},office:{name:'Pejabat FELDA',lat:3.33890128,lng:102.60955755,c:'#2277b7'},school:{name:'Sekolah',lat:3.33790094,lng:102.60956536,c:'#8e44ad'},kks:{name:'KKS (provisional)',lat:3.346333,lng:102.596861,c:'#d35400'}};
const img=document.getElementById('estateImg'),ov=document.getElementById('overlay'),routeSvg=document.getElementById('routeSvg'),statusEl=document.getElementById('status'),info=document.getElementById('info'),routeInfo=document.getElementById('routeInfo');let routeCoords=[],gpsPoint=null;
async function loadGeo(){try{const t=await fetch('index%20(2).html?src=53',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('sumber peta tidak ditemui');return r.text()});const m=t.match(/data:image\/jpeg;base64,[A-Za-z0-9+/=]+/);if(!m)throw new Error('imej GeoPDF tidak ditemui dalam sumber');img.onload=()=>{statusEl.textContent='GeoPDF FELDA v5.3 berjaya dipaparkan.';info.textContent='Paparan fokus penempatan aktif.';drawOverlay()};img.onerror=()=>{statusEl.textContent='Imej GeoPDF gagal dipaparkan.'};img.src=m[0]}catch(e){statusEl.textContent='Gagal muat GeoPDF: '+e.message;info.textContent='Ralat: '+e.message}}
function setFocus(mode){if(mode==='full'){img.style.objectFit='contain';img.style.objectPosition='center';info.textContent='Paparan peta penuh.'}else if(mode==='estate'){img.style.objectFit='cover';img.style.objectPosition='center 62%';info.textContent='Paparan ladang.'}else{img.style.objectFit='cover';img.style.objectPosition='center 42%';info.textContent='Paparan penempatan.'}setTimeout(drawOverlay,50)}
function imageRect(){const natW=img.naturalWidth||800,natH=img.naturalHeight||1147,sw=innerWidth,sh=innerHeight,fit=getComputedStyle(img).objectFit;let scale=fit==='contain'?Math.min(sw/natW,sh/natH):Math.max(sw/natW,sh/natH);let w=natW*scale,h=natH*scale;let top=(sh-h)/2,left=(sw-w)/2;const op=getComputedStyle(img).objectPosition.split(' ');if(fit==='cover'&&op.length>1&&op[1].includes('%'))top=(sh-h)*(parseFloat(op[1])/100);return{left,top,w,h}}
function xy(lat,lng){const r=imageRect();return{x:r.left+((lng-B.left)/(B.right-B.left))*r.w,y:r.top+((B.top-lat)/(B.top-B.bottom))*r.h}}
function drawOverlay(){ov.innerHTML='';Object.values(P).forEach(p=>{const q=xy(p.lat,p.lng);const m=document.createElement('div');m.className='marker';m.style.left=q.x+'px';m.style.top=q.y+'px';m.style.background=p.c;ov.appendChild(m);const l=document.createElement('div');l.className='label';l.style.left=q.x+'px';l.style.top=q.y+'px';l.textContent=p.name;ov.appendChild(l)});if(gpsPoint){const q=xy(gpsPoint.lat,gpsPoint.lng);const m=document.createElement('div');m.className='marker';m.style.left=q.x+'px';m.style.top=q.y+'px';m.style.background='#e74c3c';ov.appendChild(m);const l=document.createElement('div');l.className='label';l.style.left=q.x+'px';l.style.top=q.y+'px';l.textContent='Lokasi Saya';ov.appendChild(l)}drawRoute()}
function drawRoute(){routeSvg.innerHTML='';if(routeCoords.length<2)return;let d='';routeCoords.forEach((c,i)=>{const q=xy(c[1],c[0]);d+=(i?'L':'M')+q.x+' '+q.y+' '});routeSvg.innerHTML=`<path d="${d}" fill="none" stroke="#0b63ce" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity=".95"/>`}
async function routeTo(k){const a=P.home,b=P[k];statusEl.textContent='Mencari laluan…';try{const u=`https://router.project-osrm.org/route/v1/driving/${a.lng},${a.lat};${b.lng},${b.lat}?overview=full&geometries=geojson`;const j=await fetch(u,{cache:'no-store'}).then(r=>r.json());if(!j.routes||!j.routes[0])throw new Error('laluan tidak ditemui');const r=j.routes[0];routeCoords=r.geometry.coordinates;drawRoute();routeInfo.textContent=`Rumah → ${b.name} · ${(r.distance/1000).toFixed(2)} km · ${Math.max(1,Math.round(r.duration/60))} min`;statusEl.textContent='Laluan siap.'}catch(e){routeInfo.textContent='Routing gagal: '+e.message;statusEl.textContent='Routing perlukan internet.'}}
function clearRoute(){routeCoords=[];drawRoute();routeInfo.textContent='Belum ada laluan.';statusEl.textContent='Laluan dibuang.'}
function locateMe(){if(!navigator.geolocation){statusEl.textContent='GPS tidak disokong.';return}statusEl.textContent='Mencari lokasi GPS…';navigator.geolocation.getCurrentPosition(p=>{gpsPoint={lat:p.coords.latitude,lng:p.coords.longitude};drawOverlay();statusEl.textContent='GPS dijumpai: '+gpsPoint.lat.toFixed(6)+', '+gpsPoint.lng.toFixed(6)},e=>statusEl.textContent='GPS gagal: '+e.message,{enableHighAccuracy:true,timeout:15000})}
function openOps(){document.getElementById('opsPanel').style.display='block'}function closeOps(){if(innerWidth<=950)document.getElementById('opsPanel').style.display='none'}
const KEY='fbk_ops_v53';let data=[];try{data=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem('fbk_ops_v52')||localStorage.getItem('fbk_ops_v51')||localStorage.getItem('fbk_ops_v50')||'[]')}catch(e){data=[]}function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function render(){document.getElementById('cAll').textContent=data.length;document.getElementById('cDone').textContent=data.filter(x=>x.status==='Siap').length;document.getElementById('cProg').textContent=data.filter(x=>x.status==='Sedang berjalan').length;document.getElementById('cTodo').textContent=data.filter(x=>x.status==='Belum mula').length;document.getElementById('records').innerHTML=data.length?data.slice().reverse().map(x=>`<div class="record"><b>${esc(x.lot||'Tanpa Blok/Lot')} — ${esc(x.type)}</b><div class="small">${esc(x.status)}${x.target?' · Sasaran '+esc(x.target):''}${x.assignee?' · '+esc(x.assignee):''}</div>${x.note?`<div class="small" style="margin-top:5px">${esc(x.note)}</div>`:''}<div class="toolbar"><button class="red" onclick="delRecord('${x.id}')">Padam</button></div></div>`).join(''):'<div class="small">Belum ada rekod.</div>'}function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}function addRecord(){const lot=document.getElementById('lot'),type=document.getElementById('type'),st=document.getElementById('st'),target=document.getElementById('target'),assignee=document.getElementById('assignee'),note=document.getElementById('note');data.push({id:String(Date.now()),lot:lot.value.trim(),type:type.value,status:st.value,target:target.value,assignee:assignee.value.trim(),note:note.value.trim(),created:new Date().toISOString()});save();note.value='';statusEl.textContent='Rekod disimpan.'}function delRecord(id){data=data.filter(x=>x.id!==id);save()}function clearAll(){if(confirm('Padam semua rekod dalam peranti ini?')){data=[];save()}}function exportData(){const blob=new Blob([JSON.stringify({version:'5.3',records:data},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='fbk-estate-v53-backup.json';a.click()}
window.addEventListener('resize',drawOverlay);render();loadGeo();
</script></body></html>
