<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1812"><link rel="manifest" href="manifest.webmanifest"><title>FBK Estate</title><style>body{font-family:Arial;background:#08100d;color:#fff;display:grid;place-items:center;height:100vh;margin:0}.box{text-align:center;padding:24px}.spin{width:38px;height:38px;border:4px solid #294238;border-top-color:#d6a03a;border-radius:50%;margin:0 auto 14px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}</style></head><body><div class="box"><div class="spin"></div><b>FELDA Bukit Kepayang Digital Estate</b><p>Memuatkan aplikasi…</p></div><script>(async()=>{try{const files=['app-part-01.txt','app-part-02.txt','app-part-03.txt','app-part-04.txt','app-part-05.txt','app-part-06.txt','app-part-07.txt','app-part-08.txt'];const a=await Promise.all(files.map(f=>fetch(f).then(r=>{if(!r.ok)throw Error(f);return r.text()})));document.open();document.write(a.join(''));document.close()}catch(e){document.body.innerHTML='<div class="box"><b>Aplikasi gagal dimuatkan.</b><p>Sila refresh atau semak sambungan internet.</p></div>'}})();</script></body></html>
