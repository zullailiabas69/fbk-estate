<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-store"><title>FBK Multi-Layer Map v8.9</title><style>*{box-sizing:border-box}html,body{height:100%;margin:0;background:#0b1812;font-family:Arial,sans-serif;overflow:hidden}.layer{position:absolute;inset:0;display:none}.layer.active{display:block}.layer iframe{width:100%;height:100%;border:0;background:#0b1812}.switch{position:fixed;z-index:500;left:50%;transform:translateX(-50%);top:74px;background:#08100ded;padding:5px;border-radius:12px;display:flex;gap:4px;box-shadow:0 4px 15px #0005;max-width:96vw;overflow:auto}.switch button{border:0;border-radius:9px;background:#24372f;color:#fff;padding:8px 10px;font-weight:800;font-size:10px;white-space:nowrap}.switch button.on{background:#d6a03a;color:#172219}.note{position:fixed;z-index:490;left:10px;right:10px;bottom:10px;text-align:center;pointer-events:none}.note span{display:inline-block;background:#08100ddd;color:#dce5df;padding:6px 9px;border-radius:9px;font-size:9px}@media(max-width:760px){.switch{top:88px}.switch button{font-size:9px;padding:8px 9px}.note{bottom:68px}}</style></head><body><div id="clean" class="layer active"><iframe src="v88-clean-lot.html?v=8902" title="Peta Lot Bersih"></iframe></div><div id="a0" class="layer"><iframe src="v89-a0.html?v=8902" title="Peta A0 Diperbesar"></iframe></div><div id="ladang" class="layer"><iframe src="v89-ladang.html?v=8902" title="Peta Ladang Diperjelas"></iframe></div><div class="switch"><button id="bclean" class="on" onclick="showLayer('clean')">Lot Bersih</button><button id="ba0" onclick="showLayer('a0')">A0 Diperbesar</button><button id="bladang" onclick="showLayer('ladang')">Ladang Diperjelas</button></div><div class="note"><span>Semua layer boleh cubit dua jari. GPS/routing kekal pada modul GPS.</span></div><script>function showLayer(n){['clean','a0','ladang'].forEach(x=>{document.getElementById(x).classList.toggle('active',x===n);document.getElementById('b'+x).classList.toggle('on',x===n)});parent.postMessage({type:'fbk-map-layer',layer:n},location.origin)}</script></body></html>
