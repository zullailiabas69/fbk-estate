<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-store"><title>FBK Multi-Layer Map v8.9</title><style>*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:Arial,sans-serif;background:#ecebe6;overflow:hidden}#layers{position:fixed;z-index:50;left:8px;right:8px;top:62px;display:flex;gap:6px;flex-wrap:wrap;background:#fffffff2;border:1px solid #ddd;padding:7px;border-radius:12px;box-shadow:0 4px 16px #0002}button{border:0;border-radius:9px;padding:8px 10px;background:#202a25;color:#fff;font-weight:800;font-size:10px}button.on{background:#b52b2b}.note{width:100%;font-size:9px;color:#555}#lot,#ref{position:fixed;inset:0}#lot iframe{width:100%;height:100%;border:0}#ref{display:none;overflow:hidden;touch-action:none;overscroll-behavior:none;background:#f7f6f1}#img{position:absolute;left:50%;top:50%;transform-origin:center center;max-width:none;will-change:transform;user-select:none;-webkit-user-drag:none;pointer-events:none}#zoom{position:fixed;z-index:55;right:10px;bottom:12px;display:none;gap:6px}#zoom button{font-size:24px;min-width:54px;min-height:54px}#badge{position:fixed;z-index:54;left:10px;bottom:12px;background:#fffffff0;border:1px solid #ddd;padding:7px 9px;border-radius:10px;font-size:10px;display:none;box-shadow:0 2px 10px #0002}@media(max-width:760px){#layers{top:66px;left:5px;right:5px}#layers button{font-size:9px;padding:7px 8px}.note{font-size:8px}#badge{bottom:10px;max-width:58%}#zoom{bottom:10px}}</style></head><body><div id="layers"><button id="bLot" class="on" onclick="mode('lot')">Peta Lot</button><button id="bA0" onclick="mode('a0')">A0 Jelas</button><button id="bLad" onclick="mode('ladang')">Ladang Jelas</button><div class="note">Peta Lot kekal untuk pilih lot & rekod kerja. A0/Ladang ialah lapisan rujukan visual; GPS/routing kekal di menu GPS.</div></div><div id="lot"><iframe src="v88-clean-lot.html?v=8901" title="Peta Lot"></iframe></div><div id="ref"><img id="img" alt="Peta rujukan"></div><div id="badge"></div><div id="zoom"><button onclick="zoomBy(1/1.45)">−</button><button onclick="fit()">⌂</button><button onclick="zoomBy(1.45)">+</button></div><script>const lot=document.getElementById('lot'),ref=document.getElementById('ref'),img=document.getElementById('img'),badge=document.getElementById('badge'),zoom=document.getElementById('zoom');let kind='',scale=1,fitScale=1,x=0,y=0,W=1600,H=1132;const pts=new Map();let panStart=null,pinchStart=null,lastTap=0,cache={};function active(id){['bLot','bA0','bLad'].forEach(i=>document.getElementById(i).classList.remove('on'));document.getElementById(id).classList.add('on')}async function asset(k){if(cache[k])return cache[k];const p=k==='a0'?'v78/a0.b64':'v78/ladang.b64';const t=await fetch(p+'?v=89',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.text()});return cache[k]='data:image/jpeg;base64,'+t.trim()}async function mode(m){if(m==='lot'){lot.style.display='block';ref.style.display='none';badge.style.display='none';zoom.style.display='none';active('bLot');return}kind=m;lot.style.display='none';ref.style.display='block';badge.style.display='block';zoom.style.display='flex';active(m==='a0'?'bA0':'bLad');badge.textContent=m==='a0'?'A0 Jelas · cubit dua jari untuk zoom':'Ladang Jelas · cubit dua jari untuk zoom';try{img.src=await asset(m)}catch(e){badge.textContent='Peta rujukan gagal dimuat: '+e.message}}function apply(){img.style.transform=`translate(calc(-50% + ${x}px),calc(-50% + ${y}px)) scale(${scale})`}function fit(){const top=128,pad=20,sw=(innerWidth-pad*2)/W,sh=(innerHeight-top-pad)/H;fitScale=Math.min(sw,sh);scale=fitScale;x=0;y=top*.18;apply()}function setScale(s){scale=Math.max(fitScale*.65,Math.min(fitScale*30,s));apply();badge.textContent=(kind==='a0'?'A0 Jelas':'Ladang Jelas')+' · Zoom '+Math.round(scale/fitScale*100)+'%'}function zoomBy(f){setScale(scale*f)}img.onload=()=>{W=img.naturalWidth||1600;H=img.naturalHeight||1132;fit()};ref.addEventListener('wheel',e=>{e.preventDefault();zoomBy(e.deltaY<0?1.18:1/1.18)},{passive:false});function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function mid(a,b){return{x:(a.x+b.x)/2,y:(a.y+b.y)/2}}ref.addEventListener('pointerdown',e=>{pts.set(e.pointerId,{x:e.clientX,y:e.clientY});try{ref.setPointerCapture(e.pointerId)}catch(_){}if(pts.size===1)panStart={px:e.clientX,py:e.clientY,x,y};else if(pts.size===2){const a=[...pts.values()],m=mid(a[0],a[1]);pinchStart={d:Math.max(1,dist(a[0],a[1])),scale,x,y,mx:m.x,my:m.y};panStart=null}e.preventDefault()});ref.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pts.size>=2&&pinchStart){const a=[...pts.values()].slice(0,2),m=mid(a[0],a[1]);scale=Math.max(fitScale*.65,Math.min(fitScale*30,pinchStart.scale*dist(a[0],a[1])/pinchStart.d));x=pinchStart.x+(m.x-pinchStart.mx);y=pinchStart.y+(m.y-pinchStart.my);apply();return}if(pts.size===1&&panStart){x=panStart.x+e.clientX-panStart.px;y=panStart.y+e.clientY-panStart.py;apply()}});function end(e){pts.delete(e.pointerId);if(pts.size<2)pinchStart=null;if(pts.size===1){const p=[...pts.values()][0];panStart={px:p.x,py:p.y,x,y}}else panStart=null;e.preventDefault()}ref.addEventListener('pointerup',end);ref.addEventListener('pointercancel',end);ref.addEventListener('dblclick',e=>{e.preventDefault();zoomBy(1.6)});ref.addEventListener('touchend',e=>{if(e.touches.length)return;const n=Date.now();if(n-lastTap<320){zoomBy(1.6);lastTap=0}else lastTap=n},{passive:true});window.addEventListener('resize',()=>{if(ref.style.display==='block')fit()});</script></body></html>
