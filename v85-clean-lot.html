<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-store"><title>FBK Peta Lot + Rekod Kerja v8.5</title><style>*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:Arial,sans-serif;background:#ecebe6;color:#111;overflow:hidden}#bar{position:fixed;z-index:20;left:8px;right:8px;top:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:#fffffff2;border:1px solid #ddd;padding:7px;border-radius:12px;box-shadow:0 4px 16px #0002}button{border:0;border-radius:9px;padding:8px 10px;background:#202a25;color:#fff;font-weight:800;font-size:11px;cursor:pointer}button.on{background:#b52b2b}.title{font-weight:900;font-size:12px;margin-right:auto}.sub{font-size:9px;color:#555;width:100%}#stage{position:fixed;inset:0;overflow:hidden;touch-action:none;cursor:grab;background:#f7f6f1}#stage.drag{cursor:grabbing}#svg{position:absolute;left:50%;top:50%;transform-origin:center center;max-width:none;overflow:visible;will-change:transform}.lotline{fill:none;stroke:#a72a2a;stroke-width:.75;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}.lotnum{font-family:Arial,sans-serif;font-weight:800;fill:#101010;text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:#fff;stroke-width:3.2px;stroke-linejoin:round;cursor:pointer}.lotnum.selected{fill:#0057b8;stroke:#fff;stroke-width:4px}.blockcode{font-family:Arial,sans-serif;font-weight:700;fill:#355248;text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:#fff;stroke-width:2.8px;stroke-linejoin:round}.hide{display:none}#loader{position:fixed;inset:0;z-index:12;display:grid;place-items:center;text-align:center;padding:30px;background:#f7f6f1;color:#333;font-weight:800}#badge{position:fixed;z-index:22;left:10px;bottom:12px;background:#fffffff0;border:1px solid #ddd;padding:7px 9px;border-radius:10px;font-size:10px;box-shadow:0 2px 10px #0002}#zoom{position:fixed;z-index:22;right:10px;bottom:12px;display:flex;gap:6px}#zoom button{font-size:18px;padding:7px 12px}#pick{position:fixed;z-index:40;left:50%;bottom:14px;transform:translateX(-50%);display:none;gap:8px;align-items:center;background:#08100df2;color:#fff;padding:9px 11px;border-radius:12px;box-shadow:0 4px 16px #0007}#pick b{font-size:12px;white-space:nowrap}#pick .work{background:#d6a03a;color:#172219}#pick .cancel{background:#294238;color:#fff}.warn{color:#8b2b2b}@media(max-width:760px){#bar{left:5px;right:5px;top:5px}button{font-size:9px;padding:7px 8px}.title{font-size:10px}.sub{font-size:8px}#badge{bottom:10px;max-width:62%;font-size:9px}#zoom{bottom:10px}#pick{bottom:66px;max-width:94%;flex-wrap:wrap;justify-content:center}}</style></head><body><div id="bar"><span class="title">Peta Lot Bersih · v8.5 TEST</span><button onclick="fit()">Penuh</button><button id="b100" onclick="labelScale(1)">Nombor 100%</button><button id="b130" class="on" onclick="labelScale(1.3)">Nombor 130%</button><button id="b160" onclick="labelScale(1.6)">Nombor 160%</button><button id="bBlock" onclick="toggleBlock()">Kod 2-digit</button><button id="bLine" onclick="toggleLine()">Garis Tebal</button><div class="sub">Tekan terus <b>nombor lot</b>. Lot terpilih akan jadi biru dan butang <b>Rekod Kerja</b> akan muncul. <span class="warn">Garisan & nombor datang daripada peta A0 diperbaiki; belum disahkan sebagai sempadan rasmi.</span></div></div><div id="stage"><svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg></div><div id="loader">Memuat peta lot bersih…</div><div id="badge">Sedia memuat</div><div id="zoom"><button onclick="zoomBy(1/1.35)">−</button><button onclick="fit()">⌂</button><button onclick="zoomBy(1.35)">+</button></div><div id="pick"><b id="picked">Lot</b><button class="work" onclick="recordWork(event)">Rekod Kerja</button><button class="cancel" onclick="clearPick(event)">Batal</button></div><script>const stage=document.getElementById('stage'),svg=document.getElementById('svg'),loader=document.getElementById('loader'),badge=document.getElementById('badge'),pick=document.getElementById('pick'),picked=document.getElementById('picked');let scale=1,fitScale=1,x=0,y=0,drag=false,sx=0,sy=0,ox=0,oy=0,labelMul=1.3,showBlock=false,thick=false,W=3370.5,H=2384,selected='';function u8FromB64(s){const r=atob(s);const a=new Uint8Array(r.length);for(let i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a}async function gunzip(a){const ds=new DecompressionStream('gzip');return new Uint8Array(await new Response(new Blob([a]).stream().pipeThrough(ds)).arrayBuffer())}function reader(a){let i=0;return{byte(){return a[i++]},varint(){let n=0,s=0,b;do{b=a[i++];n|=(b&127)<<s;s+=7}while(b&128);return n>>>0},str(n){let s='';while(n--)s+=String.fromCharCode(a[i++]);return s}}}function zz(n){return(n>>>1)^-(n&1)}async function load(){try{const parts=await Promise.all([0,1,2,3,4].map(n=>fetch('v82/lot0'+n+'?v=85',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('lot0'+n+' HTTP '+r.status);return r.text()})));const raw=await gunzip(u8FromB64(parts.join('').replace(/\s+/g,'')));const r=reader(raw);if(String.fromCharCode(r.byte(),r.byte())!=='L2')throw Error('format data');const Q=2,wq=r.varint(),hq=r.varint(),nl=r.varint();W=wq/Q;H=hq/Q;svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.setAttribute('width',W);svg.setAttribute('height',H);let px=0,py=0;const frag=document.createDocumentFragment();for(let k=0;k<nl;k++){const n=r.varint();let d='';for(let j=0;j<n;j++){px+=zz(r.varint());py+=zz(r.varint());const xx=px/Q,yy=py/Q;d+=(j?'L':'M')+xx+' '+yy}const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',d);p.setAttribute('class','lotline');frag.appendChild(p)}svg.appendChild(frag);const nt=r.varint();px=0;py=0;const tf=document.createDocumentFragment();let lots=0,codes=0;for(let k=0;k<nt;k++){const sl=r.varint(),txt=r.str(sl);px+=zz(r.varint());py+=zz(r.varint());const sz=r.varint()/Q;const t=document.createElementNS('http://www.w3.org/2000/svg','text');t.textContent=txt;t.setAttribute('x',px/Q);t.setAttribute('y',py/Q);t.dataset.base=sz;if(txt.length===4){t.setAttribute('class','lotnum');lots++}else{t.setAttribute('class','blockcode hide');codes++}tf.appendChild(t)}svg.appendChild(tf);applyLabelScale();loader.style.display='none';badge.textContent=`${lots} nombor lot · tekan nombor untuk Rekod Kerja`;requestAnimationFrame(fit)}catch(e){loader.textContent='Peta gagal dimuat: '+e.message;badge.textContent='Ralat data'}}function apply(){svg.style.transform=`translate(calc(-50% + ${x}px),calc(-50% + ${y}px)) scale(${scale})`}function fit(){const pad=28,top=105;const sw=(innerWidth-pad*2)/W,sh=(innerHeight-top-pad)/H;fitScale=Math.min(sw,sh);scale=fitScale;x=0;y=top*.18;apply()}function zoomBy(f){scale=Math.max(fitScale*.65,Math.min(fitScale*22,scale*f));apply();badge.textContent='Zoom '+Math.round(scale/fitScale*100)+'% · seret untuk bergerak'}function labelScale(m){labelMul=m;['b100','b130','b160'].forEach(id=>document.getElementById(id).classList.remove('on'));document.getElementById(m===1?'b100':m===1.3?'b130':'b160').classList.add('on');applyLabelScale()}function applyLabelScale(){document.querySelectorAll('.lotnum,.blockcode').forEach(t=>{const b=+t.dataset.base||12.5;t.setAttribute('font-size',Math.max(9,b*labelMul))})}function toggleBlock(){showBlock=!showBlock;document.getElementById('bBlock').classList.toggle('on',showBlock);document.querySelectorAll('.blockcode').forEach(t=>t.classList.toggle('hide',!showBlock))}function toggleLine(){thick=!thick;document.getElementById('bLine').classList.toggle('on',thick);document.querySelectorAll('.lotline').forEach(p=>p.style.strokeWidth=thick?'1.25':'.75')}function chooseLot(t){document.querySelectorAll('.lotnum.selected').forEach(n=>n.classList.remove('selected'));t.classList.add('selected');selected=t.textContent.trim();picked.textContent='Lot '+selected;pick.style.display='flex';badge.textContent='Lot '+selected+' dipilih'}function clearPick(e){if(e)e.stopPropagation();selected='';pick.style.display='none';document.querySelectorAll('.lotnum.selected').forEach(n=>n.classList.remove('selected'));badge.textContent='Tekan nombor lot untuk pilih'}function recordWork(e){if(e)e.stopPropagation();if(!selected)return;parent.postMessage({type:'fbk-record-lot',lot:selected},location.origin)}stage.addEventListener('wheel',e=>{e.preventDefault();zoomBy(e.deltaY<0?1.18:1/1.18)},{passive:false});stage.addEventListener('pointerdown',e=>{const t=e.target.closest&&e.target.closest('.lotnum');if(t){e.preventDefault();e.stopPropagation();chooseLot(t);return}drag=true;stage.classList.add('drag');stage.setPointerCapture(e.pointerId);sx=e.clientX;sy=e.clientY;ox=x;oy=y});stage.addEventListener('pointermove',e=>{if(!drag)return;x=ox+e.clientX-sx;y=oy+e.clientY-sy;apply()});function stop(){drag=false;stage.classList.remove('drag')}stage.addEventListener('pointerup',stop);stage.addEventListener('pointercancel',stop);window.addEventListener('resize',fit);load();</script></body></html>
