<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>FBK Operasi Ringkas v7.9</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1812;color:#fff;font-family:Arial,sans-serif;padding:14px 14px 90px}.wrap{max-width:760px;margin:auto}h1{font-size:20px;margin:0 0 4px}.sub{font-size:12px;color:#b9c7c0;margin-bottom:12px}.card{background:#15251f;border:1px solid #294238;border-radius:14px;padding:12px;margin-bottom:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field label{display:block;font-size:10px;color:#b9c7c0;margin:0 0 4px}.field input,.field select,.field textarea{width:100%;background:#102019;color:#fff;border:1px solid #385247;border-radius:10px;padding:10px;font-size:14px}.field textarea{min-height:68px;resize:vertical}.full{grid-column:1/-1}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:800;cursor:pointer}.save{background:#2d7d4d;color:#fff}.clear{background:#294238;color:#fff}.row{padding:10px 0;border-bottom:1px solid #294238}.row:last-child{border-bottom:0}.row b{font-size:13px}.small{font-size:11px;color:#cbd5d0;margin-top:3px}.pill{display:inline-block;padding:2px 7px;border-radius:999px;background:#294238;font-size:9px;margin-left:5px}.empty{font-size:12px;color:#9fb0a7;padding:8px 0}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}body{padding:10px 10px 82px}}</style></head><body><div class="wrap"><h1>Operasi Ringkas</h1><div class="sub">Untuk peringkat awal: catat kerja utama sahaja. Cepat isi, cepat semak.</div><div class="card"><div class="grid"><div class="field"><label>Blok / Lot / Lokasi</label><input id="lot" placeholder="Contoh: Blok 3 / Lot 12"></div><div class="field"><label>Jenis kerja</label><select id="type"><option>Meracun</option><option>Menuai</option><option>Pruning</option><option>Membaja</option><option>Jalan ladang</option><option>Parit / saliran</option><option>Lain-lain</option></select></div><div class="field"><label>Status</label><select id="status"><option>Belum mula</option><option selected>Sedang berjalan</option><option>Siap</option></select></div><div class="field"><label>Tarikh</label><input id="date" type="date"></div><div class="field full"><label>Catatan ringkas</label><textarea id="note" placeholder="Contoh: Separuh siap / selesai pagi tadi"></textarea></div></div><div class="actions"><button class="btn save" onclick="saveRec()">Simpan</button><button class="btn clear" onclick="resetForm()">Kosongkan</button></div></div><div class="card"><b>Rekod Terkini</b><div id="list"></div></div></div><script>const KEY='fbk_ops_v54';function read(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return[]}}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function render(){const a=read().slice().sort((x,y)=>String(y.updated||y.created||'').localeCompare(String(x.updated||x.created||''))).slice(0,20);list.innerHTML=a.length?a.map(x=>`<div class="row"><b>${esc(x.lot||'Lokasi tidak dinyatakan')}</b><span class="pill">${esc(x.type||'')}</span><span class="pill">${esc(x.status||'')}</span><div class="small">${esc(x.workDate||x.date||'')}${x.note?' · '+esc(x.note):''}</div></div>`).join(''):'<div class="empty">Belum ada rekod.</div>'}function saveRec(){const l=lot.value.trim();if(!l){alert('Masukkan Blok / Lot / lokasi.');return}const a=read(),now=new Date().toISOString();a.push({id:'op-'+Date.now(),lot:l,type:type.value,status:status.value,workDate:date.value,note:note.value.trim(),created:now,updated:now});localStorage.setItem(KEY,JSON.stringify(a));resetForm();render();alert('Rekod disimpan.')}function resetForm(){lot.value='';type.value='Meracun';status.value='Sedang berjalan';date.value=new Date().toISOString().slice(0,10);note.value=''}date.value=new Date().toISOString().slice(0,10);render();</script></body></html>
