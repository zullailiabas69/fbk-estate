<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>FBK Laporan Ringkas v7.9</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1812;color:#fff;font-family:Arial,sans-serif;padding:14px 14px 90px}.wrap{max-width:760px;margin:auto}h1{font-size:20px;margin:0 0 4px}.sub{font-size:12px;color:#b9c7c0;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.card{background:#15251f;border:1px solid #294238;border-radius:14px;padding:12px;margin-bottom:12px}.metric{text-align:center}.metric strong{display:block;font-size:28px}.metric span{font-size:11px;color:#cbd5d0}.row{display:grid;grid-template-columns:1fr auto;gap:10px;padding:9px 0;border-bottom:1px solid #294238;align-items:center}.row:last-child{border-bottom:0}.small{font-size:11px;color:#cbd5d0}.bar{height:7px;background:#233b31;border-radius:999px;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;background:#d6a03a}.empty{font-size:12px;color:#9fb0a7;padding:8px 0}@media(max-width:600px){.grid{grid-template-columns:1fr 1fr}body{padding:10px 10px 82px}}</style></head><body><div class="wrap"><h1>Laporan Ringkas</h1><div class="sub">Ringkasan asas untuk peringkat awal — tiada analisis rumit.</div><div class="grid"><div class="card metric"><strong id="mAll">0</strong><span>Jumlah kerja</span></div><div class="card metric"><strong id="mRun">0</strong><span>Sedang berjalan</span></div><div class="card metric"><strong id="mDone">0</strong><span>Siap</span></div></div><div class="card"><b>Mengikut Jenis Kerja</b><div id="byType"></div></div><div class="card"><b>Mengikut Blok / Lot</b><div id="byLot"></div></div></div><script>const KEY='fbk_ops_v54';function read(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return[]}}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function section(el,groups,total){const a=Object.entries(groups).sort((x,y)=>y[1]-x[1]);el.innerHTML=a.length?a.map(([k,n])=>`<div class="row"><div><b>${esc(k)}</b><div class="bar"><i style="width:${Math.round(n/Math.max(1,total)*100)}%"></i></div></div><div class="small">${n}</div></div>`).join(''):'<div class="empty">Belum ada rekod.</div>'}function render(){const a=read();mAll.textContent=a.length;mRun.textContent=a.filter(x=>x.status==='Sedang berjalan').length;mDone.textContent=a.filter(x=>x.status==='Siap').length;const t={},l={};for(const x of a){const kt=x.type||'Lain-lain',kl=x.lot||'Lokasi tidak dinyatakan';t[kt]=(t[kt]||0)+1;l[kl]=(l[kl]||0)+1}section(byType,t,a.length);section(byLot,l,a.length)}render();</script></body></html>
