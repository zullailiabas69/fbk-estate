<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-store"><title>FBK Map v7.8.2</title><style>*{box-sizing:border-box}html,body{height:100%;margin:0;background:#0b1812;color:#fff;font-family:Arial,sans-serif;overflow:hidden}#bar{position:fixed;z-index:50;left:8px;right:8px;top:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:#08100def;padding:7px;border-radius:12px;box-shadow:0 4px 16px #0007}button{border:0;border-radius:9px;padding:8px 10px;background:#1d3128;color:#fff;font-weight:800;font-size:11px;cursor:pointer}button.on{background:#d6a03a;color:#172219}#note{font-size:10px;color:#cbd5d0;margin-left:auto}.layer{position:fixed;inset:0;display:none}.layer.on{display:block}.layer iframe{width:100%;height:100%;border:0;background:#0b1812}#ladang{background:#e9e6cd;overflow:hidden;touch-action:none}#ladImg{position:absolute;left:50%;top:50%;transform-origin:center center;max-width:none;pointer-events:none;user-select:none}#zoom{position:fixed;z-index:55;right:10px;bottom:12px;display:none;gap:6px}#zoom button{font-size:18px;padding:7px 12px}.badge{position:fixed;z-index:54;left:10px;bottom:12px;background:#08100de8;padding:7px 9px;border-radius:10px;font-size:10px}@media(max-width:760px){#bar{top:5px;left:5px;right:5px}button{font-size:9px;padding:7px 8px}#note{width:100%;margin-left:0}.badge{bottom:64px}#zoom{bottom:64px}}</style></head><body><div id="bar"><button id="bGps" class="on" onclick="mode('gps')">Peta GPS</button><button id="bA0" onclick="mode('a0')">A0 Reading</button><button id="bLad" onclick="mode('ladang')">Ladang Preview</button><span id="note">v7.8.2: A0 bacaan dipertingkat. GPS/routing asal tidak diubah.</span></div><div id="gps" class="layer on"><iframe src="v72.html?v=782-gps" title="Peta GPS"></iframe></div><div id="a0" class="layer"><iframe src="v782-a0.html?v=782" title="A0 Reading Mode"></iframe></div><div id="ladang" class="layer"><img id="ladImg" alt="Peta ladang preview"></div><div id="zoom"><button onclick="z(-.25)">−</button><button onclick="resetLad()">⌂</button><button onclick="z(.25)">+</button></div><div id="badge" class="badge">Peta GPS stabil</div><script>const layers=['gps','a0','ladang'],buttons={gps:'bGps',a0:'bA0',ladang:'bLad'},badge=document.getElementById('badge'),ladang=document.getElementById('ladang'),img=document.getElementById('ladImg'),zoom=document.getElementById('zoom');let scale=1,x=0,y=0,drag=false,sx=0,sy=0,ox=0,oy=0,loaded=false;async function loadLad(){if(loaded)return;const t=await fetch('v78/ladang.b64?v=782',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.text()});img.src='data:image/jpeg;base64,'+t.trim();loaded=true}function activate(m){layers.forEach(k=>{document.getElementById(k).classList.toggle('on',k===m);document.getElementById(buttons[k]).classList.toggle('on',k===m)})}async function mode(m){activate(m);zoom.style.display=m==='ladang'?'flex':'none';if(m==='gps')badge.textContent='Peta GPS stabil — routing & GPS kekal';if(m==='a0')badge.textContent='A0 Reading Mode — teks lebih tebal, halo putih, kontras tinggi';if(m==='ladang'){badge.textContent='Ladang Preview — HD penuh belum dimasukkan';await loadLad();resetLad()}}function apply(){img.style.transform=`translate(calc(-50% + ${x}px),calc(-50% + ${y}px)) scale(${scale})`}function resetLad(){scale=1;x=0;y=0;apply()}function z(d){scale=Math.max(.35,Math.min(8,scale+d));apply()}ladang.addEventListener('wheel',e=>{e.preventDefault();z(e.deltaY<0?.2:-.2)},{passive:false});ladang.addEventListener('pointerdown',e=>{drag=true;ladang.setPointerCapture(e.pointerId);sx=e.clientX;sy=e.clientY;ox=x;oy=y});ladang.addEventListener('pointermove',e=>{if(!drag)return;x=ox+e.clientX-sx;y=oy+e.clientY-sy;apply()});ladang.addEventListener('pointerup',()=>drag=false);ladang.addEventListener('pointercancel',()=>drag=false);</script></body></html>
