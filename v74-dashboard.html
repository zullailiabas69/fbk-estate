<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1812"><title>FBK Dashboard v7.4</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#0b1812;color:#fff}body{padding:14px 14px 84px}.wrap{max-width:900px;margin:auto}h1{font-size:20px;margin:0 0 4px}.sub{color:#b9c7c0;font-size:12px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.card{background:#15251f;border:1px solid #284238;border-radius:12px;padding:11px}.metric{text-align:center}.metric strong{display:block;font-size:24px}.metric span{font-size:11px;color:#cbd5d0}.section{margin-top:14px}.section h2{font-size:14px;margin:0 0 7px}.search{display:flex;gap:7px}.search input{flex:1;background:#102019;color:#fff;border:1px solid #385247;border-radius:10px;padding:10px}.btn{border:0;border-radius:9px;padding:9px 11px;font-weight:800;cursor:pointer;background:#d6a03a;color:#172219}.row{padding:9px 0;border-bottom:1px solid #294238}.row:last-child{border-bottom:0}.row b{font-size:12px}.small{font-size:11px;color:#cbd5d0;line-height:1.4}.pill{display:inline-block;padding:2px 6px;border-radius:999px;background:#294238;font-size:9px;margin:3px 4px 0 0}.high{color:#ff9a9a}.empty{padding:12px;color:#9fb0a7;font-size:12px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.actions button{border:0;border-radius:9px;padding:8px 10px;font-weight:700;cursor:pointer}.green{background:#2d7d4d;color:#fff}.blue{background:#2277b7;color:#fff}.gold{background:#d6a03a;color:#172219}@media(max-width:700px){body{padding:10px 10px 80px}.grid{grid-template-columns:repeat(2,1fr)}h1{font-size:17px}.search{flex-direction:column}}</style></head><body><div class="wrap"><h1>Dashboard Pengurusan v7.4</h1><div class="sub">Ringkasan operasi dan isu daripada data sebenar yang tersimpan pada peranti ini.</div><div class="grid"><div class="card metric"><strong id="mWork">0</strong><span>Rekod kerja</span></div><div class="card metric"><strong id="mActive">0</strong><span>Kerja aktif</span></div><div class="card metric"><strong id="mIssue">0</strong><span>Isu terbuka</span></div><div class="card metric"><strong id="mHigh">0</strong><span>Isu tinggi</span></div></div><div class="section"><h2>Carian Blok / Lot / Lokasi</h2><div class="card"><div class="search"><input id="q" placeholder="Contoh: Blok 3, Lot 12, jalan utama"><button class="btn" onclick="runSearch()">Cari</button></div><div id="results"></div></div></div><div class="section"><h2>Perlu Perhatian</h2><div id="attention" class="card"></div></div><div class="section"><h2>Akses Pantas</h2><div class="card"><div class="actions"><button class="green" onclick="go('ops')">Buka Operasi</button><button class="gold" onclick="go('issue')">Buka Isu</button><button class="blue" onclick="go('report')">Laporan & Backup</button></div><div class="small" style="margin-top:7px">Foto bukti kekal di modul Isu. Backup penuh dan CSV kekal di modul Laporan.</div></div></div></div><script>const OPS_KEYS=['fbk_ops_v54','fbk_ops_v53','fbk_ops_v52','fbk_ops_v51','fbk_ops_v50'],ISSUE_KEY='fbk_issues_v55';function readOps(){for(const k of OPS_KEYS){try{const v=localStorage.getItem(k);if(v)return JSON.parse(v)}catch(e){}}return[]}function readIssues(){try{return JSON.parse(localStorage.getItem(ISSUE_KEY)||'[]')}catch(e){return[]}}function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function render(){const ops=readOps(),issues=readIssues();document.getElementById('mWork').textContent=ops.length;document.getElementById('mActive').textContent=ops.filter(x=>x.status!=='Siap').length;document.getElementById('mIssue').textContent=issues.filter(x=>x.status!=='Selesai').length;document.getElementById('mHigh').textContent=issues.filter(x=>x.priority==='Tinggi'&&x.status!=='Selesai').length;const att=[...issues.filter(x=>x.status!=='Selesai').sort((a,b)=>(a.priority==='Tinggi'?-1:1)),...ops.filter(x=>x.status!=='Siap')].slice(0,8);document.getElementById('attention').innerHTML=att.length?att.map(x=>`<div class="row"><b>${esc(x.lot||'Lokasi tidak dinyatakan')}</b><div class="small">${esc(x.type||'Kerja')} · ${esc(x.status||'')}</div>${x.priority?`<span class="pill ${x.priority==='Tinggi'?'high':''}">${esc(x.priority)}</span>`:''}${x.note?`<div class="small">${esc(x.note)}</div>`:''}</div>`).join(''):'<div class="empty">Tiada perkara aktif memerlukan perhatian.</div>'}function runSearch(){const q=document.getElementById('q').value.trim().toLowerCase(),ops=readOps(),issues=readIssues();if(!q){document.getElementById('results').innerHTML='<div class="empty">Masukkan Blok, Lot atau lokasi untuk carian.</div>';return}const rows=[...ops.map(x=>({...x,_kind:'Kerja'})),...issues.map(x=>({...x,_kind:'Isu'}))].filter(x=>[x.lot,x.type,x.status,x.assignee,x.note].some(v=>String(v||'').toLowerCase().includes(q)));document.getElementById('results').innerHTML=rows.length?rows.slice(0,30).map(x=>`<div class="row"><b>${esc(x.lot||'Lokasi tidak dinyatakan')}</b><span class="pill">${x._kind}</span><div class="small">${esc(x.type||'')} · ${esc(x.status||'')}</div>${x.assignee?`<div class="small">${esc(x.assignee)}</div>`:''}${x.note?`<div class="small">${esc(x.note)}</div>`:''}</div>`).join(''):'<div class="empty">Tiada rekod sepadan.</div>'}function go(name){try{parent.showView(name)}catch(e){location.href=name==='issue'?'v55.html':name==='report'?'v56.html':'v72.html'}}document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')runSearch()});window.addEventListener('storage',render);render();</script></body></html>
