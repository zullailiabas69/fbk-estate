<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-store"><title>FBK Ladang Mobile Layer v8.9.1</title><style>*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:Arial,sans-serif;background:#eee;color:#111;overflow:hidden}#stage{position:fixed;inset:0;overflow:hidden;touch-action:none;overscroll-behavior:none;background:#f5f1df}#img{position:absolute;left:50%;top:50%;max-width:none;transform-origin:center center;will-change:transform;user-select:none;-webkit-user-drag:none;pointer-events:none}.panel{position:fixed;z-index:20;left:8px;right:8px;top:8px;background:#08100def;color:#fff;border-radius:12px;padding:8px 10px;box-shadow:0 4px 16px #0005}.panel b{font-size:12px}.small{font-size:9px;color:#d7e0db;margin-top:2px}#badge{position:fixed;z-index:22;left:10px;bottom:10px;background:#fffffff0;border:1px solid #ddd;padding:7px 9px;border-radius:10px;font-size:10px;box-shadow:0 2px 10px #0002}#zoom{position:fixed;z-index:22;right:10px;bottom:10px;display:flex;gap:6px}button{border:0;border-radius:10px;background:#202a25;color:#fff;font-weight:900;min-width:54px;min-height:54px;font-size:24px}@media(max-width:760px){#badge{max-width:58%;font-size:9px}}</style></head><body><div id="stage"><img id="img" alt="Peta Ladang Diperjelas"></div><div class="panel"><b>Peta Ladang Diperjelas · v8.9.1 TEST</b><div class="small">Cubit dua jari untuk zoom, seret untuk bergerak. GPS/routing kekal pada modul GPS.</div></div><div id="badge">Memuat peta ladang…</div><div id="zoom"><button onclick="zoomBy(1/1.45)">−</button><button onclick="fit()">⌂</button><button onclick="zoomBy(1.45)">+</button></div><script>const stage=document.getElementById('stage'),img=document.getElementById('img'),badge=document.getElementById('badge');let W=1600,H=1100,scale=1,fitScale=1,x=0,y=0,objUrl='';const pts=new Map();let panStart=null,pinchStart=null,lastTap=0;function b64bytes(s){s=s.replace(/\s+/g,'');const bin=atob(s),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u}async function load(){try{const t=await fetch('v78/ladang.b64?v=891',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.text()});const u=b64bytes(t);if(u.length<4||u[0]!==255||u[1]!==216)throw Error('data JPEG tidak sah');if(objUrl)URL.revokeObjectURL(objUrl);objUrl=URL.createObjectURL(new Blob([u],{type:'image/jpeg'}));img.src=objUrl}catch(e){badge.textContent='Peta ladang gagal: '+e.message}}img.onload=()=>{W=img.naturalWidth||W;H=img.naturalHeight||H;fit();badge.textContent='Peta ladang sedia · cubit dua jari untuk zoom'};img.onerror=()=>badge.textContent='Peta ladang gagal dipaparkan';function apply(){img.style.transform=`translate(calc(-50% + ${x}px),calc(-50% + ${y}px)) scale(${scale})`}function fit(){const pad=16,top=66;fitScale=Math.min((innerWidth-pad*2)/W,(innerHeight-top-pad)/H);scale=fitScale;x=0;y=top*.18;img.style.width=W+'px';img.style.height=H+'px';apply()}function setScale(s){scale=Math.max(fitScale*.65,Math.min(fitScale*30,s));apply();badge.textContent='Zoom '+Math.round(scale/fitScale*100)+'% · seret untuk bergerak'}function zoomBy(f){setScale(scale*f)}function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function mid(a,b){return{x:(a.x+b.x)/2,y:(a.y+b.y)/2}}stage.addEventListener('pointerdown',e=>{pts.set(e.pointerId,{x:e.clientX,y:e.clientY});try{stage.setPointerCapture(e.pointerId)}catch(_){}if(pts.size===1)panStart={px:e.clientX,py:e.clientY,x,y};else if(pts.size===2){const a=[...pts.values()],m=mid(a[0],a[1]);pinchStart={d:Math.max(1,dist(a[0],a[1])),scale,x,y,mx:m.x,my:m.y};panStart=null}e.preventDefault()});stage.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pts.size>=2&&pinchStart){const a=[...pts.values()].slice(0,2),m=mid(a[0],a[1]),ratio=dist(a[0],a[1])/pinchStart.d;scale=Math.max(fitScale*.65,Math.min(fitScale*30,pinchStart.scale*ratio));x=pinchStart.x+(m.x-pinchStart.mx);y=pinchStart.y+(m.y-pinchStart.my);apply();badge.textContent='Zoom '+Math.round(scale/fitScale*100)+'%';return}if(pts.size===1&&panStart){x=panStart.x+e.clientX-panStart.px;y=panStart.y+e.clientY-panStart.py;apply()}});function end(e){pts.delete(e.pointerId);if(pts.size<2)pinchStart=null;if(pts.size===1){const p=[...pts.values()][0];panStart={px:p.x,py:p.y,x,y}}else if(!pts.size)panStart=null;e.preventDefault()}stage.addEventListener('pointerup',end);stage.addEventListener('pointercancel',end);stage.addEventListener('wheel',e=>{e.preventDefault();zoomBy(e.deltaY<0?1.18:1/1.18)},{passive:false});stage.addEventListener('dblclick',e=>{e.preventDefault();zoomBy(1.6)});stage.addEventListener('touchend',e=>{if(e.touches.length)return;const now=Date.now();if(now-lastTap<320){zoomBy(1.6);lastTap=0}else lastTap=now},{passive:true});window.addEventListener('resize',fit);load();</script></body></html>
